<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Personal</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface2:#eef2f5; --text:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --primary:#0f766e; --link:#0f766e; --primary-ink:#fff; --accent:#14b8a6; --danger:#dc2626;
  --warn:#d97706; --done:#16a34a; --chart:#0d9488; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121a2b; --surface2:#1a2438; --text:#e5e9f0; --muted:#94a3b8;
    --line:#243049; --primary:#14b8a6; --link:#2dd4bf; --primary-ink:#04201d; --accent:#2dd4bf; --danger:#f87171;
    --warn:#fbbf24; --done:#22c55e; --chart:#12a594; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--header,var(--primary));color:var(--header-ink,var(--primary-ink));padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hlogo{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none}
header button{background:color-mix(in srgb,currentColor 16%,transparent);color:inherit;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
header .saving{font-size:12px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav[hidden]{display:none}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--link);font-weight:600}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px;line-height:16px}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0}
small,.muted{color:var(--muted);font-size:13px}
small{display:block}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
.toolbar:first-child{margin-top:4px}
.card{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);font:inherit}
button.card{cursor:pointer}
.card.new{border-left:4px solid var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:22px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);color:var(--link);display:grid;place-items:center;font-weight:700;flex:none}
.btn{display:inline-block;text-align:center;text-decoration:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%;margin-bottom:10px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--link);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.icon{background:var(--surface2);border:0;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;flex:none;cursor:pointer}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 8px}
.grid4 label{margin:0 0 3px}
.grid4 input{padding:8px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:4px;background:var(--surface2);color:var(--muted)}
.st.ok{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.st.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.group-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.video{margin-top:10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.video iframe,.video video{width:100%;height:100%;border:0;display:block}
.video.pending{background:var(--surface2);aspect-ratio:auto}
.video.pending button{width:100%;padding:14px;background:none;border:0;color:var(--link);font:inherit;font-weight:600;cursor:pointer}
.presc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presc span{background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.obs{background:color-mix(in srgb,var(--accent) 12%,transparent);border-left:3px solid var(--accent);padding:8px 10px;border-radius:8px;margin:10px 0 0;font-size:14px}
.sets{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.set.done{background:var(--done);border-color:var(--done);color:#fff}
.loadin{display:flex;align-items:center;gap:8px;margin-top:10px}
.loadin label{margin:0;white-space:nowrap}
.loadin input{max-width:140px;padding:8px 10px}
.item.complete{border-color:var(--done)}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--done);transition:width .3s}
details{margin-top:8px;font-size:14px}
summary{color:var(--link);cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{font-size:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.code{font-size:30px;font-weight:800;letter-spacing:.18em;text-align:center;padding:10px;background:var(--surface2);border-radius:12px;margin:10px 0;font-variant-numeric:tabular-nums}
.effort{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.effort button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.effort button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.eff{font-weight:700;font-size:13px;padding:4px 9px;border-radius:8px;background:var(--surface2);white-space:nowrap}
.quote{margin:8px 0 0;font-size:14px;font-style:italic}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(2,6,23,.55)}
.dlg{padding:18px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pick{max-height:50dvh;overflow:auto;margin-top:10px}
.pick button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
#timer{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#timer[hidden]{display:none}
#timer .big{font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#timer .btns{display:flex;gap:10px}
#timer button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.hello{background:linear-gradient(135deg,var(--header,var(--primary)),color-mix(in srgb,var(--header,var(--primary)) 84%,#fff));color:var(--header-ink,var(--primary-ink));border-radius:var(--radius);padding:18px 18px 18px 22px;margin-bottom:14px;box-shadow:inset 5px 0 0 var(--accent)}
.hello h2{color:inherit}
.hello small{color:inherit;opacity:.88}
.auth{max-width:420px;margin:24px auto 0}
.auth .logo{width:84px;height:84px;margin:0 auto 12px;display:block;border-radius:22px;object-fit:cover}
.auth .logo.wide{width:auto;max-width:min(240px,80%);height:auto;max-height:96px;border-radius:0;object-fit:contain}
.auth .slogan{text-align:center;color:var(--muted);margin:4px 0 0}
.social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 0}
.social a{display:inline-flex;align-items:center;gap:6px;color:var(--link);text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.auth h2{text-align:center}
.auth .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin:18px 0 6px}
.auth .tabs button{border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--muted);cursor:pointer}
.auth .tabs button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.msg.info{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:60px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chart svg{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px}
.chart .line{fill:none;stroke:var(--chart);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--chart);stroke:var(--surface);stroke-width:2}
.chart .dot.on{r:6}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tip{min-height:20px;font-size:13px;color:var(--muted);margin-top:4px}
.chart .tip b{color:var(--text)}
.chart .sum{font-size:14px;margin:4px 0 0}
.chart .chips{margin:8px 0 0}
.reply{background:var(--surface2);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.reply p{margin:2px 0 0}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;margin-top:10px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin:10px 0 8px}
.grid2 label{margin:0 0 3px}
.grid2 input{padding:8px}
.nodesc{font-size:12px;color:var(--muted);padding:10px 0;text-align:center;line-height:1.2}
.group{border:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);border-radius:calc(var(--radius) + 6px);padding:10px 8px 0;margin-bottom:12px}
.group-h{font-size:13px;font-weight:700;color:var(--link);margin:0 6px 8px}
.group .card{margin-bottom:8px}
label.checkrow{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);margin:0;color:var(--text);font-size:15px;cursor:pointer}
label.checkrow input{width:22px;height:22px;flex:none;accent-color:var(--primary)}
#timer.work{background:rgba(4,64,56,.96)}
.techrow{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.techrow label{margin:0;white-space:nowrap}
.techrow select{padding:8px 10px}
.presc span.tech{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.obs.techinfo{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.setwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.setwrap small{font-size:11px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.grid3 label,.mgrid label{margin:10px 0 3px}
.grid3 input,.mgrid input{padding:8px 10px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 8px}
.calc{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.photos3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
label.photoslot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;margin:0;background:var(--surface2)}
.photoslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photoslot span{position:relative;z-index:1;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;margin-bottom:6px}
.photoslot.empty{justify-content:center}
.photoslot.empty span{background:none;color:var(--muted);font-size:13px;text-align:center;margin:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp figure{margin:0;text-align:center}
.cmp img,.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface2);display:block;cursor:zoom-in}
.cmp figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.nophoto{aspect-ratio:3/4;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.q{border-bottom:1px solid var(--line);padding:10px 0}
.q p{margin:0 0 6px;font-size:14.5px;line-height:1.4}
.yn{display:flex;gap:22px}
.yn label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:15px;cursor:pointer}
.yn input{width:20px;height:20px;accent-color:var(--primary)}
.stat .delta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.bigphoto{width:100%;max-height:75dvh;object-fit:contain;border-radius:12px;display:block;background:#000}
.answers td:first-child{color:var(--muted);width:45%}
.answers td:last-child{text-align:left;white-space:normal}
.alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.alts .chip{padding:4px 10px;font-size:13px}
.swapped{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--link);margin-top:4px}
details.sd{margin-top:10px}
.sdt{width:100%;border-collapse:collapse;margin-top:6px}
.sdt th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:2px 4px}
.sdt td{padding:3px 4px;border:0}
.sdt td:first-child{font-weight:700;width:44px;text-align:center}
.sdt input{padding:7px 8px;text-align:center}
.ptl{display:flex;gap:3px;margin:10px 0 4px;border-radius:10px;overflow:hidden}
.ptl div{background:var(--surface2);padding:6px 6px 5px;min-width:0;text-align:center}
.ptl div span{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptl div small{font-size:11px}
.ptl div.on{background:var(--primary);color:var(--primary-ink)}
.ptl div.on small{color:inherit;opacity:.85}
.phase{border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin-top:8px}
.phase .pg{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.phase .pg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phase label{margin:6px 0 2px}
.phase input{padding:7px 9px}
.period{border-left:4px solid var(--accent)}
.presc em{font-style:normal;font-weight:500;opacity:.75}
.money{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px}
.kpi.bad b{color:var(--danger)}
.daygrp{font-size:13px;font-weight:700;color:var(--muted);text-transform:capitalize;margin:16px 0 6px}
.sess{display:flex;gap:12px;align-items:flex-start}
.sess .t{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr svg{width:220px;height:220px;background:#fff;border-radius:12px;padding:8px}
.pixcode{width:100%;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:70px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{padding:7px 12px;font-size:14px}
.offline{background:var(--warn);color:#000;text-align:center;font-size:13px;padding:6px;border-radius:10px;margin-bottom:12px}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"><div class="spinner"></div></main>
<nav id="tabs" hidden></nav>
<dialog id="dlg"></dialog>
<div id="timer" hidden></div>
<div id="toast"></div>

<script src="marca.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script>
  // Captura o link de recuperação de senha antes do Supabase limpar o endereço.
  window.__RECOVERY__ = /type=recovery/.test(location.hash);
  if (!window.__TEST_API__ && window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"><\/script>');
  }
</script>
<script>
/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const localDay = (d = new Date()) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const fmtDateTime = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

function hexRgb(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h, 16); return isNaN(n) || h.length !== 6 ? null : [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgbHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function lum(c) { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); }
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const inkFor = c => contrast(c, [255, 255, 255]) >= contrast(c, [15, 23, 42]) ? '#ffffff' : '#0f172a';
// Ajusta a cor (escurecendo ou clareando) até ter contraste mínimo com o fundo.
function readableOn(c, bg, min = 4.5) { const to = lum(bg) > .4 ? [0, 0, 0] : [255, 255, 255]; let t = 0, v = c; while (contrast(v, bg) < min && t < 1) { t += .05; v = mix(c, to, t); } return v; }
// No modo escuro a cor da marca é clareada até se destacar do fundo escuro.
const darkVariant = c => readableOn(c, [18, 26, 43], 3);
const DARK_BG = [18, 26, 43];
function applyBrand() {
  document.title = APP_NAME;
  const p = hexRgb(MARCA.corPrincipal), a = hexRgb(MARCA.corDestaque) || p;
  if (!p) return;
  // Marca escura (ex.: azul-marinho): no modo escuro o topo continua na cor da marca
  // e botões/links usam a cor de destaque, que aparece melhor no fundo escuro.
  const darkBrand = contrast(p, DARK_BG) < 3;
  const pd = darkBrand && contrast(a, DARK_BG) >= 3 ? a : darkVariant(p), ad = darkVariant(a);
  const hd = darkBrand ? p : pd;
  // contra o fundo mais exigente de cada tema (cinza claro / cartão escuro)
  const linkL = readableOn(p, [238, 242, 245]), linkD = readableOn(pd, [26, 36, 56]);
  const css = `:root{--primary:${rgbHex(p)};--primary-ink:${inkFor(p)};--accent:${rgbHex(a)};--link:${rgbHex(linkL)};--header:${rgbHex(p)};--header-ink:${inkFor(p)}}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--primary:${rgbHex(pd)};--primary-ink:${inkFor(pd)};--accent:${rgbHex(ad)};--link:${rgbHex(linkD)};--header:${rgbHex(hd)};--header-ink:${inkFor(hd)}}}`;
  const st = document.createElement('style'); st.id = 'brandStyle'; st.textContent = css; document.head.appendChild(st);
  const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = rgbHex(p);
}

function videoEmbed(url) {
  url = (url || '').trim();
  if (!/^https:\/\//i.test(url)) return '';
  let m;
  const ifr = src => `<iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" loading="lazy"></iframe>`;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)))
    return ifr(`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1&modestbranding=1`);
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/)))
    return ifr(`https://player.vimeo.com/video/${m[1]}${m[2] ? '?h=' + m[2] : ''}`);
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/)))
    return ifr(`https://drive.google.com/file/d/${m[1]}/preview`);
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url))
    return `<video src="${esc(url)}" controls playsinline preload="metadata"></video>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" style="display:block;padding:14px;color:#fff">Abrir vídeo ↗</a>`;
}

const pixClean = (t, max) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 .\-@+_]/g, '').trim().toUpperCase().slice(0, max);
function crc16(str) {
  let crc = 0xFFFF;
  for (const ch of new TextEncoder().encode(str)) { crc ^= ch << 8; for (let i = 0; i < 8; i++) crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1; crc &= 0xFFFF; }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
// Pix "copia e cola" (BR Code estático, padrão do Banco Central).
function pixPayload({ key, name, city, amount, txid }) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const acc = f('00', 'br.gov.bcb.pix') + f('01', String(key).trim());
  let p = f('00', '01') + f('26', acc) + f('52', '0000') + f('53', '986');
  if (amount) p += f('54', Number(amount).toFixed(2));
  p += f('58', 'BR') + f('59', pixClean(name, 25) || 'RECEBEDOR') + f('60', pixClean(city, 15) || 'BRASIL');
  p += f('62', f('05', (String(txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25)) || '***'));
  p += '6304';
  return p + crc16(p);
}

// O Supabase devolve no máximo 1.000 linhas por consulta: busca em lotes até acabar.
async function allRows(build, page = 1000, max = 100000) {
  const out = [];
  for (let from = 0; from < max; from += page) {
    const { data, error } = await build().range(from, from + page - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < page) break;
  }
  return out;
}

  if (S.role !== 'trainer' || _detBusy || !api.logsDetails) return;
  const ids = list.filter(l => !l.details && !logDetails.has(l.id) && !String(l.id).startsWith('local')).map(l => l.id);
  if (!ids.length) return;
  _detBusy = true;
  try { (await api.logsDetails(ids)).forEach(r => logDetails.set(r.id, r.details || [])); ids.forEach(id => { if (!logDetails.has(id)) logDetails.set(id, []); }); }
  catch { _detBusy = false; return; }
  _detBusy = false;
  if (!['plan', 'template'].includes(S.view.name) && !$('#dlg').open) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
let feedN = 50, finN = 60;
// Último treino de um aluno: dos registros carregados ou, se for mais antigo, do resumo vindo do banco.
function lastLogOf(sid) {
  const l = logsOf(sid)[0]; if (l) return l;
  const full = S.fullLogs && S.fullLogs.get(sid); if (full && full[0]) return full[0];
  const at = S.last && S.last.get(sid); return at ? { done_at: at } : null;
}
// Ficha do aluno: histórico completo dele (com o detalhe dos exercícios), buscado ao abrir.
async function ensureStudentLogs(sid) {
  S.fullLogs = S.fullLogs || new Map();
  if (S.fullLogs.has(sid)) return;
  S.fullLogs.set(sid, null);
  try {
    const rows = await api.logs({ studentId: sid, limit: 300 });
    const byId = new Map(S.logs.map(l => [l.id, l]));
    S.fullLogs.set(sid, rows.map(r => byId.has(r.id) ? Object.assign(byId.get(r.id), r) : r));
    if (S.view.name === 'student' && S.view.sid === sid && !$('#dlg').open) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch { S.fullLogs.delete(sid); }
}
const studentLogs = sid => (S.fullLogs && S.fullLogs.get(sid)) || logsOf(sid);

// Link aberto por uma notificação: #aluno=<id> (personal) ou #treino / #historico / #avaliacao (aluno).
let pendingDeep = null;
function takeDeepLink(hash) {
  const m = String(hash || '').match(/^#(aluno=[\w-]+|treino|historico|avaliacao)$/);
  return m ? m[1] : null;
}
function applyDeep() {
  const d = pendingDeep; pendingDeep = null;
  if (!d) return;
  if (S.role === 'trainer' && d.startsWith('aluno=')) { const sid = d.slice(6); if (studentById(sid)) go({ name: 'student', sid }); }
  if (S.role === 'student' && !d.startsWith('aluno=')) { S.view = { name: d === 'treino' || can(d) ? d : 'treino' }; render(); window.scrollTo(0, 0); }
}
async function boot() {
  pendingDeep = takeDeepLink(location.hash);
  if (pendingDeep) history.replaceState(null, '', location.pathname + location.search);
  const inv = location.hash.match(/convite=([A-Za-z0-9]+)/);
  if (inv) { store.set('mp_invite', inv[1].toUpperCase()); authTab = 'signup'; history.replaceState(null, '', location.pathname + location.search); }
  if (!api) return renderSetup();
  api.onAuth((ev) => {
    if (ev === 'PASSWORD_RECOVERY') { window.__RECOVERY__ = true; renderNewPassword(); }
    if (ev === 'SIGNED_OUT') { resetState(); renderAuth(); }
  });
  let user = null;
  try { user = await api.getUser(); } catch {}
  if (window.__RECOVERY__ && user) return renderNewPassword();
  if (!user) return renderAuth();
  await enter(user);
  flushPending();
}
function resetState() {
  Object.assign(S, { user: null, role: null, trainer: null, me: null, students: [], exercises: [], plans: [], logs: [], templates: [], assess: [], anam: {}, prefs: null, charges: [], sessions: [], view: { name: 'loading' }, offline: false });
}
async function enter(user) {
  S.user = user;
  $('#tabs').hidden = true;
  $('#top').innerHTML = `<h1>${esc(APP_NAME)}</h1>`;
  $('#app').innerHTML = '<div class="spinner"></div>';
  const cacheKey = 'mp_cache_' + user.id;
  try {
    const t = await api.myTrainer(user.id);
    if (t) {
      S.role = 'trainer'; S.trainer = t;
      await loadTrainer();
      go({ name: 'students' }); return applyDeep();
    }
    let me = await api.myStudent();
    const inv = store.get('mp_invite', null);
    let inviteErr = null;
    if (!me && inv) {
      try { await api.claimInvite(inv); me = await api.myStudent(); toast('Conta ligada ao seu personal!'); }
      catch (e) { inviteErr = ptError(e); }
      store.del('mp_invite');
    }
    if (me) {
      S.role = 'student'; S.me = me;
      await loadStudent();
      store.set(cacheKey, { me: S.me, plans: S.plans, exercises: S.exercises, logs: S.logs, assess: S.assess, anam: S.anam, charges: S.charges, sessions: S.sessions });
      go({ name: 'treino' }); return applyDeep();
    }
    S.role = 'none';
    renderOnboarding(inviteErr);
  } catch (e) {
    const cache = store.get(cacheKey, null);
    if (cache) {
      Object.assign(S, cache, { role: 'student', offline: true });
      return go({ name: 'treino' });
    }
    $('#app').innerHTML = `<div class="msg err">${esc(ptError(e))}</div><button class="btn block" data-act="reload">Tentar de novo</button><button class="btn block" data-act="logout">Sair</button>`;
  }
}
const LOG_WINDOW_DAYS = 60;   // visão geral do personal: últimos 60 dias (a ficha do aluno busca o histórico completo)
async function loadTrainer() {
  const since = new Date(Date.now() - LOG_WINDOW_DAYS * 864e5).toISOString();
  api.lastWorkouts && api.lastWorkouts().then(r => { S.last = new Map(r.map(x => [x.student_id, x.last_at])); if (S.view.name !== 'plan' && S.view.name !== 'template') render(); }).catch(() => {});
  let anams;
  [S.students, S.exercises, S.plans, S.logs, S.templates, S.assess, anams, S.prefs, S.charges, S.sessions] = await Promise.all([api.students(), api.exercises(), api.plans(), api.logsLight(since), api.templates(), api.assessments(), api.anamneses(), api.prefs().catch(() => null),
    api.charges().catch(() => []), api.sessions(new Date(Date.now() - 60 * 864e5).toISOString()).catch(() => [])]);
  S.anam = Object.fromEntries(anams.map(a => [a.student_id, a]));
}
async function loadStudent() {
  let anams;
  S.me.features = { ...ALL_ON, ...(S.me.features || {}) };
  [S.plans, S.exercises, S.logs, S.assess, anams, S.prefs, S.charges, S.sessions] = await Promise.all([api.plans(S.me.id), api.exercises(), api.logs({ studentId: S.me.id, limit: 200 }),
    can('avaliacao') ? api.assessments(S.me.id) : [], api.anamneses(), api.prefs().catch(() => null),
    can('financeiro') ? api.charges().catch(() => []) : [], can('agenda') ? api.sessions(new Date(Date.now() - 864e5).toISOString()).catch(() => []) : []]);
  S.anam = Object.fromEntries(anams.map(a => [a.student_id, a]));
}

const empty = (t, d) => `<div class="empty"><b>${esc(t)}</b>${esc(d)}</div>`;

function statusOf(s) {
  if (!s.user_id) return `<span class="st">⏳ Convite pendente</span>`;
  const last = lastLogOf(s.id);
  if (!last) return `<span class="st warn">Ainda não treinou</span>`;
  const d = daysAgo(last.done_at);
  return `<span class="st ${d <= 3 ? 'ok' : d <= 7 ? 'warn' : 'bad'}">Treinou ${agoText(last.done_at)}</span>`;
}

/* ---------- validade do treino ---------- */
function validity(p) {
  if (!p || !p.ends_on) return null;
  const n = daysUntil(p.ends_on);
  if (n < 0) return { cls: 'bad', txt: `Vencido há ${-n} dia${n === -1 ? '' : 's'}`, n };
  if (n === 0) return { cls: 'warn', txt: 'Vence hoje', n };
  if (n <= 7) return { cls: 'warn', txt: `Vence em ${n} dia${n === 1 ? '' : 's'}`, n };
  return { cls: '', txt: `Válido até ${fmtDay(p.ends_on)}`, n };
}
const validityChip = p => { const v = validity(p); return v ? `<span class="st ${v.cls}">${v.cls ? '⚠️' : '📅'} ${v.txt}</span>` : ''; };
function renewalOf(s) { return plansOf(s.id).map(validity).filter(v => v && v.n <= 7).sort((a, b) => a.n - b.n)[0] || null; }

/* ---------- gráfico de evolução de carga ---------- */
const chartSel = {};
function loadSeries(logs) {
  const by = {};
  [...logs].sort((a, b) => new Date(a.done_at) - new Date(b.done_at)).forEach(l => (l.details || []).forEach(d => {
    const v = parseLoad(d.load); if (v == null) return;
    (by[d.name] ||= []).push({ t: l.done_at, v, raw: d.load });
  }));
  return by;
}
// Gráfico de linha (uma série). P = [{ t: data ISO, v: número, raw: texto exibido }], em ordem cronológica.
function lineChart(P, aria, each = 'treino') {
  const W = 320, H = 150, L = 36, R = 12, T = 10, B = 22;
  const vs = P.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo = Math.max(0, lo - 5); hi += 5; }
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const tstep = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw);
  lo = Math.max(0, Math.floor(lo / tstep) * tstep); hi = Math.ceil(hi / tstep) * tstep;
  const x = i => P.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (P.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = []; for (let t = lo; t <= hi + 1e-9; t += tstep) ticks.push(t);
  const step = P.length > 1 ? (W - L - R) / (P.length - 1) : W - L - R;
  const first = P[0], last = P[P.length - 1];
  const tip = p => `${fmtShort(p.t)} · <b>${esc(p.raw)}</b>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
      ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmtNum(t)}</text>`).join('')}
      <text class="axis" x="${x(0)}" y="${H - 6}" text-anchor="${P.length === 1 ? 'middle' : 'start'}">${fmtShort(first.t)}</text>
      ${P.length > 1 ? `<text class="axis" x="${x(P.length - 1)}" y="${H - 6}" text-anchor="end">${fmtShort(last.t)}</text>` : ''}
      ${P.length > 1 ? `<path class="line" d="${P.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('')}"/>` : ''}
      ${P.map((p, i) => `<circle class="dot ${i === P.length - 1 ? 'on' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4"/>`).join('')}
      ${P.map((p, i) => `<rect class="hit" data-tip="${esc(tip(p))}" data-i="${i}" x="${(x(i) - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}"/>`).join('')}
    </svg>
    <div class="tip">Último: ${tip(last)} <span class="muted">· toque nos pontos para ver cada ${each}</span></div>
    <details><summary>Ver tabela</summary><table>${[...P].reverse().map(p => `<tr><td>${fmtShort(p.t)}</td><td>${esc(p.raw)}</td></tr>`).join('')}</table></details>`;
}
function sumLine(P, unit = '', each = 'treinos') {
  const first = P[0], last = P[P.length - 1], diff = last.v - first.v;
  const pct = first.v ? Math.round(diff / first.v * 100) : 0;
  return P.length > 1
    ? `<b>${esc(first.raw)} → ${esc(last.raw)}</b> <span class="muted">(${diff >= 0 ? '+' : ''}${fmtNum(diff)}${unit}${pct ? `, ${pct > 0 ? '+' : ''}${pct}%` : ''} em ${P.length} ${each})</span>`
    : `<b>${esc(first.raw)}</b> <span class="muted">— registre mais ${each} para ver a evolução</span>`;
}
function loadChart(logs, key) {
  const by = loadSeries(logs);
  const names = Object.keys(by).sort((a, b) => by[b].length - by[a].length || a.localeCompare(b, 'pt'));
  const who = S.role === 'trainer' ? 'o aluno anotar' : 'você anotar';
  if (!names.length) return `<div class="card chart"><h3>Evolução de carga</h3><p class="muted" style="margin:6px 0 0">Aparece aqui quando ${who} a carga usada ao finalizar os treinos.</p></div>`;
  const sel = names.includes(chartSel[key]) ? chartSel[key] : names[0];
  const P = by[sel].slice(-20);
  return `<div class="card chart" data-chart="${esc(key)}">
    <h3>Evolução de carga</h3>
    <div class="chips">${names.map(n => `<button class="chip ${n === sel ? 'on' : ''}" data-act="chartEx" data-key="${esc(key)}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p class="sum">${sumLine(P)}</p>
    ${lineChart(P, `Carga em ${sel} ao longo do tempo`)}
  </div>`;
}
function chartTip(el) {
  const c = el.closest('.chart'); if (!c) return;
  c.querySelector('.tip').innerHTML = el.dataset.tip;
  c.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === +el.dataset.i));
}
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('rect.hit'); if (el) chartTip(el); });
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('rect.hit'); if (el) chartTip(el); });

function statsHtml(logs) {
  const now = Date.now();
  const in7 = logs.filter(l => now - new Date(l.done_at) < 7 * 864e5).length;
  const l30 = logs.filter(l => now - new Date(l.done_at) < 30 * 864e5);
  const effs = l30.map(l => l.effort).filter(Boolean);
  const avg = effs.length ? fmtNum(effs.reduce((a, b) => a + b, 0) / effs.length) : '–';
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const end = now - i * 7 * 864e5, start = end - 7 * 864e5;
    return logs.filter(l => { const t = new Date(l.done_at).getTime(); return t > start && t <= end; }).length;
  }).reverse();
  const max = Math.max(3, ...weeks);
  return `<div class="stats">
      <div class="stat"><b>${in7}</b><small>treinos em 7 dias</small></div>
      <div class="stat"><b>${l30.length}</b><small>treinos em 30 dias</small></div>

      <div class="bars">${weeks.map((w, i) => `<div title="${w} treino(s)">${w || ''}<i style="height:${Math.round(w / max * 100)}%"></i></div>`).join('')}</div>
    </div>`;
}

/* ---------- modos do exercício e bi-sets ---------- */
const TECHS = [
  ['', 'Nenhuma', ''],
  ['dropset', 'Drop-set', 'Na última série, ao chegar na falha, reduza a carga em 20–30% e continue sem descansar.'],
  ['restpause', 'Rest-pause', 'Ao chegar na falha, descanse 10–15 segundos e faça mais repetições com a mesma carga. Repita 2–3 vezes.'],
  ['piramide', 'Pirâmide', 'A cada série, aumente a carga e diminua as repetições.'],
  ['falha', 'Até a falha', 'Faça repetições até não conseguir mais com boa execução.'],
  ['excentrica', 'Excêntrica lenta', 'Na volta do movimento (descida), vá bem devagar: 3 a 5 segundos.'],
  ['isometria', 'Pico de contração', 'Segure 2 segundos na posição de maior contração em cada repetição.']
];
const techOf = it => TECHS.find(t => t[0] === (it.tech || '') && t[0]) || null;
const MODES = [['reps', '🔁 Reps'], ['time', '⏱ Tempo'], ['cardio', '🏃 Cardio']];
const modeOf = it => (it && it.mode) || 'reps';
const nSets = it => modeOf(it) === 'cardio' ? 1 : Math.min(Math.max(parseInt(it.sets) || 3, 1), 12);
const durSec = it => modeOf(it) === 'cardio' ? Math.max(parseFloat(String(it.dur).replace(',', '.')) || 20, 1) * 60 : Math.max(parseInt(it.dur) || 30, 1);
function blocksOf(items) {
  const out = [];
  (items || []).forEach((it, i) => { if (i > 0 && it.link && out.length) out[out.length - 1].push(i); else out.push([i]); });
  return out;
}
const groupName = n => n === 2 ? 'Bi-set' : n === 3 ? 'Tri-set' : 'Circuito';
function labelsOf(items) {
  const lab = {};
  blocksOf(items).forEach((b, bi) => b.forEach((i, k) => { lab[i] = b.length > 1 ? `${bi + 1}${String.fromCharCode(65 + k)}` : `${bi + 1}`; }));
  return lab;
}
const isLastInBlock = (items, i) => !(items[i + 1] && items[i + 1].link);
function wrapBlocks(items, card) {
  return blocksOf(items).map(b => b.length === 1 ? card(b[0]) :
    `<div class="group"><div class="group-h">🔗 ${groupName(b.length)} — faça em sequência e descanse só no final</div>${b.map(card).join('')}</div>`).join('');
}

/* ---------- periodização ---------- */
const PERIOD_PRESETS = {
  linear8: { label: 'Linear · 8 semanas', phases: [
    { name: 'Adaptação', weeks: 2, pct: -10, reps: '15', note: 'Carga leve, foco em técnica' },
    { name: 'Hipertrofia', weeks: 3, pct: 0, reps: '10-12', note: 'Cadência controlada' },
    { name: 'Força', weeks: 2, pct: 10, reps: '6-8', note: 'Descanso maior entre as séries' },
    { name: 'Deload', weeks: 1, pct: -30, reps: '12', note: 'Semana leve para recuperar' }] },
  ondulatoria6: { label: 'Ondulatória · 6 semanas', phases: [
    { name: 'Volume', weeks: 1, pct: -5, reps: '12-15', note: '' }, { name: 'Intensidade', weeks: 1, pct: 5, reps: '8-10', note: '' },
    { name: 'Volume', weeks: 1, pct: 0, reps: '12-15', note: '' }, { name: 'Intensidade', weeks: 1, pct: 8, reps: '6-8', note: '' },
    { name: 'Pico', weeks: 1, pct: 12, reps: '4-6', note: 'Cargas altas, técnica perfeita' }, { name: 'Deload', weeks: 1, pct: -30, reps: '12', note: 'Recuperação' }] },
  progressiva4: { label: 'Progressão de carga · 4 semanas', phases: [
    { name: 'Semana base', weeks: 1, pct: 0, reps: '', note: '' }, { name: 'Progressão 1', weeks: 1, pct: 5, reps: '', note: '' },
    { name: 'Progressão 2', weeks: 1, pct: 10, reps: '', note: '' }, { name: 'Deload', weeks: 1, pct: -20, reps: '', note: 'Semana leve' }] }
};
const perWeeks = per => (per && per.phases || []).reduce((a, f) => a + (Math.max(0, parseInt(f.weeks) || 0)), 0);
function periodNow(p, date = localDay()) {
  const per = p && p.period;
  if (!per || !per.start || !(per.phases || []).length) return null;
  const days = Math.round((new Date(date + 'T00:00') - new Date(per.start + 'T00:00')) / 864e5), total = perWeeks(per);
  if (days < 0) return { status: 'antes', week: 0, total, startsIn: -days };
  const week = Math.floor(days / 7) + 1;
  if (week > total) return { status: 'fim', week, total };
  let acc = 0;
  for (const [idx, f] of per.phases.entries()) { acc += Math.max(0, parseInt(f.weeks) || 0); if (week <= acc) return { status: 'ativa', week, total, phase: f, idx }; }
  return null;
}
const roundLoad = v => v >= 20 ? Math.round(v) : Math.round(v * 2) / 2;
function adjustLoad(load, pct) {
  if (!pct) return load;
  const m = String(load || '').match(/\d+(?:[.,]\d+)?/); if (!m) return load;
  return String(load).replace(m[0], fmtNum(roundLoad(parseFloat(m[0].replace(',', '.')) * (1 + pct / 100))));
}
const pctTxt = v => `${v > 0 ? '+' : ''}${v}%`;
// Item como o aluno deve fazer hoje: exercício trocado (alternativa) e ajustes da fase da periodização.
function effItem(P, i, pr) {
  const it = { ...P.items[i] };
  const sw = pr && pr.swap && pr.swap[i];
  // Exercício trocado: a carga prescrita era do original, então não vale; o aluno anota a dele.
  if (sw && sw !== it.ex) { it.orig = it.ex; it.ex = sw; it.load = ''; }
  const pn = periodNow(P);
  if (pn && pn.status === 'ativa' && modeOf(it) !== 'cardio') {
    const f = pn.phase, pct = parseFloat(f.pct) || 0;
    if (f.reps && modeOf(it) === 'reps' && it.tech !== 'piramide') it.reps = f.reps;
    if (pct && it.load) { it.baseLoad = it.load; it.load = adjustLoad(it.load, pct); it.pct = pct; }
  }
  return it;
}
function periodTimeline(p, pn) {
  const per = p.period;
  return `<div class="ptl">${per.phases.map((f, idx) => `<div style="flex:${Math.max(1, parseInt(f.weeks) || 1)}" class="${pn && pn.status === 'ativa' && pn.idx === idx ? 'on' : ''}"><span>${esc(f.name || 'Fase')}</span><small>${parseInt(f.weeks) || 0} sem · ${pctTxt(parseFloat(f.pct) || 0)}</small></div>`).join('')}</div>`;
}
function periodChip(p) {
  const pn = periodNow(p); if (!pn) return '';
  return pn.status === 'ativa' ? `<span class="st ok">📈 Semana ${pn.week}/${pn.total} · ${esc(pn.phase.name)}</span>`
    : pn.status === 'fim' ? `<span class="st warn">📈 Periodização concluída</span>` : `<span class="st">📈 Começa em ${pn.startsIn} dia(s)</span>`;
}
function syncPeriodEnds(p) { if (p.student_id && p.period && p.period.start) p.ends_on = localDay(new Date(p.period.start + 'T12:00').getTime() + (perWeeks(p.period) * 7 - 1) * 864e5); }
function periodEditor(p, tpl) {
  const per = p.period;
  if (!per) return `<div class="card"><h3>📈 Periodização</h3>
    <p class="muted" style="margin:6px 0 10px">Divida o treino em fases com ajuste automático de carga e repetições. O aluno vê em que semana está e a carga já calculada.</p>
    <div class="chips" style="flex-wrap:wrap;margin:0">${Object.entries(PERIOD_PRESETS).map(([k, v]) => `<button class="chip" data-act="perPreset" data-k="${k}">${v.label}</button>`).join('')}<button class="chip" data-act="perPreset" data-k="custom">Personalizada</button></div></div>`;
  const pn = tpl ? null : periodNow(p);
  return `<div class="card period"><div class="row"><h3 class="grow">📈 Periodização</h3><button class="link" data-act="perRemove">Remover</button></div>
    ${tpl ? '<small>Ao aplicar o modelo, a periodização começa no dia da aplicação.</small>' : `<label>Início</label><input type="date" data-perstart="1" value="${esc(per.start || '')}">`}
    ${periodTimeline(p, pn)}
    <small>${perWeeks(per)} semanas no total${pn ? (pn.status === 'ativa' ? ` · hoje: semana ${pn.week}, fase “${esc(pn.phase.name)}”` : pn.status === 'fim' ? ' · concluída' : ` · começa em ${pn.startsIn} dia(s)`) : ''}${!tpl ? ' · a validade do treino acompanha o fim da periodização' : ''}</small>
    ${per.phases.map((f, idx) => `<div class="phase">
      <div class="pg"><div><label>Fase ${idx + 1}</label><input data-ph="${idx}" data-pk="name" value="${esc(f.name)}" placeholder="Ex.: Hipertrofia"></div>
        <div><label>Semanas</label><input data-ph="${idx}" data-pk="weeks" inputmode="numeric" value="${esc(f.weeks)}"></div></div>
      <div class="pg2"><div><label>Carga (%)</label><input data-ph="${idx}" data-pk="pct" inputmode="numeric" value="${esc(f.pct)}" placeholder="0, +10, -20"></div>
        <div><label>Reps (vazio = do exercício)</label><input data-ph="${idx}" data-pk="reps" value="${esc(f.reps || '')}" placeholder="10-12"></div></div>
      <label>Orientação da fase</label><input data-ph="${idx}" data-pk="note" value="${esc(f.note || '')}" placeholder="Ex.: descanso maior entre as séries">
      <button class="link" data-act="perDelPhase" data-ph="${idx}">✕ Remover fase</button></div>`).join('')}
    <button class="btn block" style="margin-top:10px" data-act="perAddPhase">+ Adicionar fase</button>
    <small>A carga de cada fase é calculada a partir da carga do exercício (ex.: 40 kg com +10% → 44 kg).</small></div>`;
}

function queuePlanSave(p) {

      if (planUnsaved === p) planUnsaved = null;

function updateProgress(P, pr) {
  let total = 0, d = 0;
  (P.items || []).forEach((it, i) => { const n = nSets(it); total += n; d += (pr.done[i] || []).slice(0, n).filter(Boolean).length; });

  const bar = $('#progBar'), txt = $('#progTxt');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = `${d} de ${total} séries feitas hoje (${pct}%)`;
  return { d, total };
}

async function flushPending() {
  if (!S.user || S.role !== 'student' || _flushing) return;   // um envio por vez (evita mandar o mesmo treino duas vezes)
  _flushing = true;
  try {
    const k = 'mp_pending_' + S.user.id;
    const raw = store.get(k, []);
    const pend = (Array.isArray(raw) ? raw : []).filter(x => x && typeof x === 'object' && x.student_id);   // ignora itens corrompidos
    if (pend.length !== (Array.isArray(raw) ? raw.length : 0)) store.set(k, pend);
    if (!pend.length) return;
    let sent = 0;
    for (const log of pend) {
      log.id ||= newId();
      try {
        await sendLog(log);
        // tira da fila logo após enviar, um por um
        store.set(k, store.get(k, []).filter(x => x.id !== log.id));
        if (!S.logs.some(x => x.id === log.id)) S.logs.unshift({ ...log, trainer_seen: false });
        notifyQuiet('log', log.id); sent++;
      } catch { store.set(k, store.get(k, []).map(x => x === log || (!x.id && x.done_at === log.done_at) ? log : x)); }
    }
    S.logs.sort((a, b) => new Date(b.done_at) - new Date(a.done_at));
    if (sent) { toast('Treinos pendentes enviados ao personal ✓'); render(); }
  } finally { _flushing = false; }
}

/* ===================== cronômetro de descanso ===================== */
let timerInt = null, timerEnd = 0, audioCtx = null, timerDone = null;
function beep() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.25, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2);
    });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
}
// opts.work = cronômetro de execução (exercício por tempo / cardio); opts.onDone roda ao terminar ou ao tocar em "Concluir".
function startTimer(sec, opts = {}) {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  timerEnd = Date.now() + sec * 1000;
  timerDone = opts.onDone || null;
  const el = $('#timer'); el.hidden = false;
  el.classList.toggle('work', !!opts.work);
  el.innerHTML = `<div>${esc(opts.label || 'Descanso')}</div><div class="big" id="tBig"></div><div class="btns">${opts.work
    ? `<button data-act="tCancel">Cancelar</button><button data-act="tAdd">+15s</button><button data-act="tDone">Concluir</button>`
    : `<button data-act="tAdd">+15s</button><button data-act="tSkip">Pular</button>`}</div>`;
  clearInterval(timerInt);
  const tick = () => {
    const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
    const b = $('#tBig'); if (b) b.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (left <= 0 && opts.work) { clearInterval(timerInt); beep(); finishWork(); return; }
    if (left <= 0) {
      clearInterval(timerInt); beep();
      el.innerHTML = `<div class="big" style="font-size:44px">Bora! 🔥</div><div>Próxima série</div><div class="btns"><button data-act="tSkip">OK</button></div>`;
      setTimeout(() => { if (Date.now() - timerEnd > 2500) el.hidden = true; }, 3000);
    }
  };
  tick(); timerInt = setInterval(tick, 250);
}

function finishWork() {
  clearInterval(timerInt);
  const f = timerDone; timerDone = null;
  $('#timer').hidden = true; $('#timer').classList.remove('work');
  if (f) f();
}

    const d = document.querySelector('details.card summary b'); if (d) d.closest('details').open = true;
  },
  // aluno: aulas e mensalidades
  sessResp: async el => { await api.respondSession(el.dataset.id, el.dataset.r); const x = S.sessions.find(y => y.id === el.dataset.id); x.response = el.dataset.r; render(); toast(el.dataset.r === 'confirmada' ? 'Presença confirmada ✓' : 'Seu personal foi avisado'); },
  studentPay: el => studentPayDialog(S.charges.find(c => c.id === el.dataset.id)),
  copyPix: async () => { const t = $('#pixcode'); try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); } toast('Código Pix copiado ✓'); },
  informPay: async el => { await api.informPayment(el.dataset.id); const c = S.charges.find(x => x.id === el.dataset.id); c.status = 'informada'; $('#dlg').close(); render(); toast('Seu personal foi avisado do pagamento ✓'); },
  seenReplies: () => { const latest = S.logs.map(l => l.replied_at || '').sort().pop(); if (latest) store.set('mp_reply_seen_' + S.user.id, latest); render(); },
  // periodização
  perPreset: el => {
    const { p, tpl } = cur(), k = el.dataset.k;
    const phases = k === 'custom' ? [{ name: 'Fase 1', weeks: 4, pct: 0, reps: '', note: '' }] : JSON.parse(JSON.stringify(PERIOD_PRESETS[k].phases));
    p.period = { start: localDay(), phases }; if (!tpl) syncPeriodEnds(p);
    render(); queuePlanSave(p); toast(k === 'custom' ? 'Periodização criada — ajuste as fases' : `Periodização “${PERIOD_PRESETS[k].label}” aplicada`);
  },
  perAddPhase: () => { const { p, tpl } = cur(); p.period.phases.push({ name: 'Nova fase', weeks: 1, pct: 0, reps: '', note: '' }); if (!tpl) syncPeriodEnds(p); render(); queuePlanSave(p); },
  perDelPhase: el => { const { p, tpl } = cur(); p.period.phases.splice(+el.dataset.ph, 1); if (!p.period.phases.length) p.period = null; else if (!tpl) syncPeriodEnds(p); render(); queuePlanSave(p); },
  perRemove: () => { const { p } = cur(); if (!confirm('Remover a periodização deste treino?')) return; p.period = null; render(); queuePlanSave(p); },
  // alternativas de exercício
  addAlt: el => altDialog(cur().p, +el.dataset.i),
  pickAlt: el => {
    const dlg = $('#dlg'), it = dlg._plan.items[dlg._i], id = el.dataset.id;
    it.alts = it.alts || []; it.alts = it.alts.includes(id) ? it.alts.filter(x => x !== id) : [...it.alts, id];
    queuePlanSave(dlg._plan); dlg._draw();
  },
  delAlt: el => { const { p } = cur(), it = p.items[+el.dataset.i]; it.alts = (it.alts || []).filter(x => x !== el.dataset.id); render(); queuePlanSave(p); },
  swapEx: el => swapDialog(S.plans[curPlan], +el.dataset.i),
  pickSwap: el => {
    const P = S.plans[curPlan], i = +el.dataset.i, pr = progress(P.id), id = el.dataset.id;
    pr.swap = pr.swap || {}; pr.sd = pr.sd || {};
    if (id === P.items[i].ex) delete pr.swap[i]; else pr.swap[i] = id;
    delete pr.loads[i]; delete pr.sd[i];
    store.set(progKey(P.id), pr); $('#dlg').close(); render();
    toast(id === P.items[i].ex ? 'De volta ao exercício original' : `Trocado por ${exById(id).name} — só no treino de hoje`);
  },
  sfUse: el => { const f = $('#asForm'); f.body_fat.value = String(el.dataset.bf).replace('.', ','); f.body_fat.dispatchEvent(new Event('input', { bubbles: true })); toast('% de gordura preenchido pelas dobras'); },
  // modelos
  newTemplate: () => formDialog('Novo modelo de treino', [{ k: 'name', label: 'Nome do modelo', req: true, ph: 'Ex.: Hipertrofia iniciante A' }, { k: 'focus', label: 'Foco / descrição', ph: 'Ex.: Inferiores + core' }], {}, async d => {
    const t = await api.addTemplate({ ...d, items: [] }); S.templates.push(t); $('#dlg').close(); go({ name: 'template', tid: t.id });
  }),
  openTemplate: el => go({ name: 'template', tid: el.dataset.id }),
  saveAsTemplate: () => {
    flushPlanSave();
    const { p } = cur();
    formDialog('Salvar como modelo', [{ k: 'name', label: 'Nome do modelo', req: true }], { name: p.name + (p.focus ? ' — ' + p.focus : '') }, async d => {
      const t = await api.addTemplate({ name: d.name, focus: p.focus || '', items: JSON.parse(JSON.stringify(p.items)), period: p.period ? { phases: JSON.parse(JSON.stringify(p.period.phases)) } : null });
      S.templates.push(t); toast('Modelo salvo — veja na aba 📋 Modelos');
    }, '<p class="muted" style="margin:8px 0 0">O modelo guarda os exercícios, séries, bi-sets e observações para você aplicar em outros alunos.</p>');
  },
  applyTemplate: () => { flushPlanSave(); applyDialog(cur().p); },
  dupTemplate: async () => {
    flushPlanSave(); const { p } = cur();
    const t = await api.addTemplate({ name: p.name + ' (cópia)', focus: p.focus || '', items: JSON.parse(JSON.stringify(p.items || [])), period: p.period ? JSON.parse(JSON.stringify(p.period)) : null });
    S.templates.push(t); go({ name: 'template', tid: t.id }); toast('Modelo duplicado');
  },
  delTemplate: async () => {
    const { p } = cur(); if (!confirm(`Excluir o modelo “${p.name}”? Os treinos já aplicados aos alunos continuam.`)) return;
    clearTimeout(planSaveT); planSaveT = null;
    await api.deleteTemplate(p.id); S.templates = S.templates.filter(x => x !== p); go({ name: 'templates' });
  },
  // acompanhamento
  seenAll: async () => { await markSeen(S.logs); render(); toast('Tudo marcado como visto'); },
  // exercícios
  newEx: () => exerciseDialog(null),
  editEx: el => exerciseDialog(exById(el.dataset.id)),
  seedEx: async () => { for (const [name, grp, kind] of BASIC) S.exercises.push(await api.addExercise({ name, grp, kind: kind || 'reps' })); render(); toast('Exercícios adicionados — agora coloque seus vídeos'); },
  delEx: async el => {
    const id = el.dataset.id, using = S.plans.filter(p => (p.items || []).some(i => i.ex === id));
    if (!confirm(using.length ? `Este exercício está em ${using.length} treino(s) e será removido deles. Excluir mesmo assim?` : 'Excluir exercício?')) return;
    for (const p of using) { p.items = p.items.filter(i => i.ex !== id); await api.updatePlan(p.id, { items: p.items }); }
    for (const t of S.templates.filter(t => (t.items || []).some(i => i.ex === id))) { t.items = t.items.filter(i => i.ex !== id); await api.updateTemplate(t.id, { items: t.items }); }
    await api.deleteExercise(id);
    S.exercises = S.exercises.filter(e => e.id !== id);
    $('#dlg').close(); render();
  },
  exGroup: el => { exFilter.g = el.dataset.g; render(); },
  import: () => $('#importFile').click(),
  // aluno
  curPlan: el => { curPlan = +el.dataset.k; render(); window.scrollTo(0, 0); },
  showVideo: el => { const i = +el.dataset.i, box = $('#v' + i); box.classList.remove('pending'); box.innerHTML = videoEmbed(exById(S.plans[curPlan].items[i].ex).video); },
  toggleSet: el => {
    const P = S.plans[curPlan], i = +el.dataset.i, k = +el.dataset.k, it = P.items[i];
    const wasDone = !!(progress(P.id).done[i] || [])[k];
    if (!wasDone && modeOf(it) === 'time') {
      const ex = exById(it.ex);
      return startTimer(durSec(it), { work: true, label: `${ex ? ex.name : 'Exercício'} · série ${k + 1}`, onDone: () => { markSet(P, i, k, true); afterSet(P, i); } });
    }
    markSet(P, i, k, !wasDone);
    if (!wasDone && modeOf(it) !== 'cardio') afterSet(P, i);
  },
  startCardio: el => {
    const P = S.plans[curPlan], i = +el.dataset.i, it = P.items[i], ex = exById(it.ex);
    startTimer(durSec(it), { work: true, label: `🏃 ${ex ? ex.name : 'Cardio'}${it.int ? ' · ' + it.int : ''}`, onDone: () => { markSet(P, i, 0, true); toast('Cardio concluído ✅'); } });
  },
  tDone: () => finishWork(),
  tCancel: () => { clearInterval(timerInt); timerDone = null; $('#timer').hidden = true; $('#timer').classList.remove('work'); },
  finish: () => finishDialog(),
  tAdd: () => { timerEnd += 15000; },
  tSkip: () => { clearInterval(timerInt); $('#timer').hidden = true; }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !actions[el.dataset.act]) return;
  e.preventDefault();
  const r = actions[el.dataset.act](el);
  if (r && r.then) {
    el.disabled = true;
    r.catch(err => toast('Erro: ' + ptError(err))).finally(() => { el.disabled = false; });
  }
});
let trainerNameT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'exq') {
    exFilter.q = t.value; const pos = t.selectionStart; render();
    const n = $('#exq'); n.focus(); n.setSelectionRange(pos, pos); return;
  }
  if (t.dataset.sd && S.role === 'student') {
    const [i, k, f] = t.dataset.sd.split(':'), P = S.plans[curPlan], pr = progress(P.id);
    pr.sd = pr.sd || {}; pr.sd[i] = pr.sd[i] || {}; pr.sd[i][k] = { ...(pr.sd[i][k] || {}), [f]: t.value };
    pr.start ||= Date.now(); store.set(progKey(P.id), pr); return;
  }
  if ((t.dataset.ph !== undefined || t.dataset.perstart) && S.role === 'trainer') {
    const { p, tpl } = cur(); if (!p || !p.period) return;
    if (t.dataset.perstart) p.period.start = t.value || localDay();
    else { const f = t.dataset.pk; p.period.phases[+t.dataset.ph][f] = ['weeks', 'pct'].includes(f) ? (t.value === '' ? '' : (parseFloat(t.value.replace(',', '.')) || 0)) : t.value; }
    if (!tpl) syncPeriodEnds(p);
    queuePlanSave(p);
    if (t.dataset.perstart) render();   // atualiza "hoje: semana X" e a linha do tempo
    return;
  }
  if (t.dataset.load !== undefined && S.role === 'student') {
    const P = S.plans[curPlan], pr = progress(P.id); pr.loads[+t.dataset.load] = t.value; store.set(progKey(P.id), pr); return;
  }
  if (t.dataset.sf === 'name') {
    S.trainer.name = t.value; clearTimeout(trainerNameT);
    trainerNameT = setTimeout(() => api.updateTrainer(S.trainer.id, S.trainer.name).catch(er => toast('Erro: ' + ptError(er))), 700); return;
  }
  const { s, p } = cur();
  if (t.dataset.pf && p) { p[t.dataset.pf] = t.dataset.pf === 'ends_on' ? (t.value || null) : t.value; queuePlanSave(p); if (t.dataset.pf === 'name') $('#top h1').textContent = (s ? s.name + ' · ' : 'Modelo · ') + t.value; return; }
  if (t.dataset.f && p) { p.items[+t.dataset.i][t.dataset.f] = t.value; queuePlanSave(p); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pref) { setPref(t.dataset.pref, t.type === 'checkbox' ? t.checked : (t.value || null)); return; }
  if (t.dataset && t.dataset.feat && S.role === 'trainer') {
    const { s } = cur(); s.features = { ...featuresOf(s), [t.dataset.feat]: t.checked };
    api.updateStudent(s.id, { features: s.features }).then(() => toast('Ferramentas atualizadas ✓')).catch(er => toast('Erro: ' + ptError(er)));
    const sm = t.closest('details').querySelector('summary'); if (sm) sm.innerHTML = `<b>🧰 Ferramentas de ${esc(s.name.split(' ')[0])}</b> · ${FEATURES.filter(([k]) => s.features[k]).length} de ${FEATURES.length} ligadas`;
    return;
  }
  if (t.dataset && t.dataset.deffeat && S.role === 'trainer') {
    S.trainer.default_features = { ...ALL_ON, ...(S.trainer.default_features || {}), [t.dataset.deffeat]: t.checked };
    api.updateTrainerData(S.trainer.id, { default_features: S.trainer.default_features }).then(() => toast('Padrão atualizado ✓')).catch(er => toast('Erro: ' + ptError(er)));
    return;
  }
  if (t.dataset && t.dataset.ph !== undefined && S.role === 'trainer') { render(); return; }   // fase editada: redesenha a linha do tempo
  if (t.tagName === 'SELECT' && t.dataset.f && S.role === 'trainer') {
    const { p } = cur(); if (p && p.items[+t.dataset.i][t.dataset.f] !== t.value) { p.items[+t.dataset.i][t.dataset.f] = t.value; queuePlanSave(p); }
  }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  let d;
  try { d = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(d.exercises) || !Array.isArray(d.students)) throw 0; }
  catch { return alert('Arquivo de backup inválido.'); }
  if (!confirm(`Importar ${d.exercises.length} exercícios e ${d.students.length} alunos?`)) return;
  try {
    toast('Importando…');
    const map = {};
    for (const x of d.exercises) {
      const found = S.exercises.find(y => y.name.toLowerCase() === (x.name || '').toLowerCase());
      const row = found || await api.addExercise({ name: x.name, grp: x.group || 'Outros', video: x.video || '', notes: x.notes || '' });
      if (found && !found.video && x.video) { await api.updateExercise(found.id, { video: x.video }); found.video = x.video; }
      if (!found) S.exercises.push(row);
      map[x.id] = row.id;
    }
    for (const st of d.students) {
      const s = await api.addStudent({ name: st.name, goal: st.goal || '', notes: st.notes || '' });
      S.students.push(s);
      for (const [i, p] of (st.plans || []).entries()) {
        S.plans.push(await api.addPlan({ student_id: s.id, name: p.name, focus: p.focus || '', position: i,
          items: (p.items || []).filter(it => map[it.exId]).map(it => ({ ex: map[it.exId], sets: it.sets, reps: it.reps, load: it.load, rest: it.rest, obs: it.obs })) }));
      }
    }
    render(); toast('Importação concluída ✓');
  } catch (er) { alert('Erro na importação: ' + ptError(er)); render(); }
});

boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
