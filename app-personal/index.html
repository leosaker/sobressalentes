<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Personal</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface2:#eef2f5; --text:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --primary:#0f766e; --primary-ink:#fff; --accent:#14b8a6; --danger:#dc2626;
  --warn:#d97706; --done:#16a34a; --chart:#0d9488; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121a2b; --surface2:#1a2438; --text:#e5e9f0; --muted:#94a3b8;
    --line:#243049; --primary:#14b8a6; --primary-ink:#04201d; --accent:#2dd4bf; --danger:#f87171;
    --warn:#fbbf24; --done:#22c55e; --chart:#12a594; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
header .saving{font-size:12px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav[hidden]{display:none}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--primary);font-weight:600}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px;line-height:16px}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0}
small,.muted{color:var(--muted);font-size:13px}
small{display:block}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
.toolbar:first-child{margin-top:4px}
.card{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);font:inherit}
button.card{cursor:pointer}
.card.new{border-left:4px solid var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:22px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none}
.btn{display:inline-block;text-align:center;text-decoration:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%;margin-bottom:10px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--primary);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
.icon{background:var(--surface2);border:0;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;flex:none;cursor:pointer}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 8px}
.grid4 label{margin:0 0 3px}
.grid4 input{padding:8px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:4px;background:var(--surface2);color:var(--muted)}
.st.ok{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.st.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.group-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.video{margin-top:10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.video iframe,.video video{width:100%;height:100%;border:0;display:block}
.video.pending{background:var(--surface2);aspect-ratio:auto}
.video.pending button{width:100%;padding:14px;background:none;border:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer}
.presc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presc span{background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.obs{background:color-mix(in srgb,var(--accent) 12%,transparent);border-left:3px solid var(--accent);padding:8px 10px;border-radius:8px;margin:10px 0 0;font-size:14px}
.sets{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.set.done{background:var(--done);border-color:var(--done);color:#fff}
.loadin{display:flex;align-items:center;gap:8px;margin-top:10px}
.loadin label{margin:0;white-space:nowrap}
.loadin input{max-width:140px;padding:8px 10px}
.item.complete{border-color:var(--done)}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--done);transition:width .3s}
details{margin-top:8px;font-size:14px}
summary{color:var(--primary);cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{font-size:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.code{font-size:30px;font-weight:800;letter-spacing:.18em;text-align:center;padding:10px;background:var(--surface2);border-radius:12px;margin:10px 0;font-variant-numeric:tabular-nums}
.effort{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.effort button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.effort button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.eff{font-weight:700;font-size:13px;padding:4px 9px;border-radius:8px;background:var(--surface2);white-space:nowrap}
.quote{margin:8px 0 0;font-size:14px;font-style:italic}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(2,6,23,.55)}
.dlg{padding:18px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pick{max-height:50dvh;overflow:auto;margin-top:10px}
.pick button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
#timer{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#timer[hidden]{display:none}
#timer .big{font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#timer .btns{display:flex;gap:10px}
#timer button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.hello{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px}
.hello h2{color:#fff}
.hello small{color:rgba(255,255,255,.88)}
.auth{max-width:420px;margin:24px auto 0}
.auth .logo{width:72px;height:72px;margin:0 auto 10px;display:block}
.auth h2{text-align:center}
.auth .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin:18px 0 6px}
.auth .tabs button{border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--muted);cursor:pointer}
.auth .tabs button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.msg.info{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:60px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chart svg{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px}
.chart .line{fill:none;stroke:var(--chart);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--chart);stroke:var(--surface);stroke-width:2}
.chart .dot.on{r:6}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tip{min-height:20px;font-size:13px;color:var(--muted);margin-top:4px}
.chart .tip b{color:var(--text)}
.chart .sum{font-size:14px;margin:4px 0 0}
.chart .chips{margin:8px 0 0}
.reply{background:var(--surface2);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.reply p{margin:2px 0 0}
.offline{background:var(--warn);color:#000;text-align:center;font-size:13px;padding:6px;border-radius:10px;margin-bottom:12px}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"><div class="spinner"></div></main>
<nav id="tabs" hidden></nav>
<dialog id="dlg"></dialog>
<div id="timer" hidden></div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
  // Captura o link de recuperação de senha antes do Supabase limpar o endereço.
  window.__RECOVERY__ = /type=recovery/.test(location.hash);
  if (!window.__TEST_API__ && window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"><\/script>');
  }
</script>
<script>
/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const localDay = (d = new Date()) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const fmtDateTime = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const daysAgo = iso => Math.floor((new Date(localDay()) - new Date(localDay(iso))) / 864e5);
const agoText = iso => { const d = daysAgo(iso); return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`; };
const daysUntil = d => Math.round((new Date(d + 'T00:00') - new Date(localDay() + 'T00:00')) / 864e5);
const fmtDay = d => new Date(d + 'T12:00').toLocaleDateString('pt-BR');
const fmtShort = iso => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const parseLoad = s => { const m = String(s || '').replace(',', '.').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR');
const baseUrl = () => location.href.split('#')[0].split('?')[0];
const CFG = window.APP_CONFIG || {};
const APP_NAME = CFG.APP_NAME || 'Meu Personal';

const store = {
  mem: {},
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return k in this.mem ? this.mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { this.mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch { delete this.mem[k]; } }
};
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function ptError(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  const map = [
    [/Invalid login credentials/i, 'E-mail ou senha incorretos.'],
    [/already registered|already been registered/i, 'Este e-mail já tem conta. Use “Entrar”.'],
    [/Email not confirmed/i, 'Confirme seu e-mail primeiro (veja sua caixa de entrada e o spam).'],
    [/Password should be at least/i, 'A senha precisa ter pelo menos 6 caracteres.'],
    [/rate limit|too many/i, 'Muitas tentativas. Aguarde alguns minutos e tente de novo.'],
    [/Failed to fetch|NetworkError|Load failed/i, 'Sem conexão com a internet.'],
    [/row-level security.*trainers/i, 'Este e-mail não está autorizado como personal (veja o LEIA-ME).'],
    [/invalid.*email|Unable to validate email/i, 'E-mail inválido.']
  ];
  for (const [re, pt] of map) if (re.test(m)) return pt;
  return m;
}

/* ===================== vídeos ===================== */
function videoEmbed(url) {
  url = (url || '').trim();
  if (!/^https:\/\//i.test(url)) return '';
  let m;
  const ifr = src => `<iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" loading="lazy"></iframe>`;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)))
    return ifr(`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1&modestbranding=1`);
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/)))
    return ifr(`https://player.vimeo.com/video/${m[1]}${m[2] ? '?h=' + m[2] : ''}`);
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/)))
    return ifr(`https://drive.google.com/file/d/${m[1]}/preview`);
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url))
    return `<video src="${esc(url)}" controls playsinline preload="metadata"></video>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" style="display:block;padding:14px;color:#fff">Abrir vídeo ↗</a>`;
}

/* ===================== acesso ao Supabase ===================== */
function makeApi(sb) {
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  const authChk = r => { if (r.error) throw r.error; return r.data; };
  return {
    async getUser() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    onAuth(cb) { sb.auth.onAuthStateChange((ev, s) => cb(ev, s ? s.user : null)); },
    signIn: (email, password) => sb.auth.signInWithPassword({ email, password }).then(authChk).then(d => d.user),
    signUp: (email, password) => sb.auth.signUp({ email, password, options: { emailRedirectTo: baseUrl() } }).then(authChk),
    signOut: () => sb.auth.signOut(),
    resetPassword: email => sb.auth.resetPasswordForEmail(email, { redirectTo: baseUrl() }).then(authChk),
    updatePassword: password => sb.auth.updateUser({ password }).then(authChk),

    myTrainer: uid => sb.from('trainers').select('*').eq('id', uid).maybeSingle().then(chk),
    createTrainer: name => sb.from('trainers').insert({ name }).select().single().then(chk),
    updateTrainer: (id, name) => sb.from('trainers').update({ name }).eq('id', id).then(chk),
    myStudent: () => sb.rpc('my_student').then(chk).then(r => (r && r[0]) || null),
    claimInvite: code => sb.rpc('claim_invite', { code }).then(chk),

    students: () => sb.from('students').select('*').order('name').then(chk),
    addStudent: s => sb.from('students').insert(s).select().single().then(chk),
    updateStudent: (id, s) => sb.from('students').update(s).eq('id', id).then(chk),
    deleteStudent: id => sb.from('students').delete().eq('id', id).then(chk),
    resetInvite: id => sb.rpc('reset_invite', { p_student: id }).then(chk),

    exercises: () => sb.from('exercises').select('*').order('name').then(chk),
    addExercise: e => sb.from('exercises').insert(e).select().single().then(chk),
    updateExercise: (id, e) => sb.from('exercises').update(e).eq('id', id).then(chk),
    deleteExercise: id => sb.from('exercises').delete().eq('id', id).then(chk),

    plans: studentId => { let q = sb.from('plans').select('*'); if (studentId) q = q.eq('student_id', studentId); return q.order('position').then(chk); },
    addPlan: p => sb.from('plans').insert(p).select().single().then(chk),
    updatePlan: (id, p) => sb.from('plans').update(p).eq('id', id).then(chk),
    deletePlan: id => sb.from('plans').delete().eq('id', id).then(chk),

    logs: ({ studentId, since, limit } = {}) => {
      let q = sb.from('workout_logs').select('*').order('done_at', { ascending: false });
      if (studentId) q = q.eq('student_id', studentId);
      if (since) q = q.gte('done_at', since);
      return q.limit(limit || 500).then(chk);
    },
    addLog: l => sb.from('workout_logs').insert(l).then(chk),
    markSeen: ids => sb.from('workout_logs').update({ trainer_seen: true }).in('id', ids).then(chk),
    replyLog: (id, text) => sb.from('workout_logs').update({ trainer_reply: text, replied_at: text ? new Date().toISOString() : null, trainer_seen: true }).eq('id', id).then(chk)
  };
}
const api = window.__TEST_API__ ||
  (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase
    ? makeApi(window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY))
    : null);

/* ===================== estado ===================== */
const S = {
  user: null, role: null, trainer: null, me: null,
  students: [], exercises: [], plans: [], logs: [],
  view: { name: 'loading' }, offline: false
};
const exById = id => S.exercises.find(e => e.id === id);
const groups = () => [...new Set(S.exercises.map(e => e.grp).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
const studentById = id => S.students.find(s => s.id === id);
const plansOf = sid => S.plans.filter(p => p.student_id === sid).sort((a, b) => a.position - b.position);
const logsOf = sid => S.logs.filter(l => l.student_id === sid);
const unseen = () => S.logs.filter(l => !l.trainer_seen);
let exFilter = { q: '', g: '' };
let authTab = 'login', authMsg = null;

function go(v) { flushPlanSave(); S.view = v; render(); window.scrollTo(0, 0); }

/* ===================== início e login ===================== */
async function boot() {
  const inv = location.hash.match(/convite=([A-Za-z0-9]+)/);
  if (inv) { store.set('mp_invite', inv[1].toUpperCase()); authTab = 'signup'; history.replaceState(null, '', location.pathname + location.search); }
  if (!api) return renderSetup();
  api.onAuth((ev) => {
    if (ev === 'PASSWORD_RECOVERY') { window.__RECOVERY__ = true; renderNewPassword(); }
    if (ev === 'SIGNED_OUT') { resetState(); renderAuth(); }
  });
  let user = null;
  try { user = await api.getUser(); } catch {}
  if (window.__RECOVERY__ && user) return renderNewPassword();
  if (!user) return renderAuth();
  await enter(user);
  flushPending();
}
function resetState() {
  Object.assign(S, { user: null, role: null, trainer: null, me: null, students: [], exercises: [], plans: [], logs: [], view: { name: 'loading' }, offline: false });
}
async function enter(user) {
  S.user = user;
  $('#tabs').hidden = true;
  $('#top').innerHTML = `<h1>${esc(APP_NAME)}</h1>`;
  $('#app').innerHTML = '<div class="spinner"></div>';
  const cacheKey = 'mp_cache_' + user.id;
  try {
    const t = await api.myTrainer(user.id);
    if (t) {
      S.role = 'trainer'; S.trainer = t;
      await loadTrainer();
      return go({ name: 'students' });
    }
    let me = await api.myStudent();
    const inv = store.get('mp_invite', null);
    let inviteErr = null;
    if (!me && inv) {
      try { await api.claimInvite(inv); me = await api.myStudent(); toast('Conta ligada ao seu personal!'); }
      catch (e) { inviteErr = ptError(e); }
      store.del('mp_invite');
    }
    if (me) {
      S.role = 'student'; S.me = me;
      await loadStudent();
      store.set(cacheKey, { me: S.me, plans: S.plans, exercises: S.exercises, logs: S.logs });
      return go({ name: 'treino' });
    }
    S.role = 'none';
    renderOnboarding(inviteErr);
  } catch (e) {
    const cache = store.get(cacheKey, null);
    if (cache) {
      Object.assign(S, cache, { role: 'student', offline: true });
      return go({ name: 'treino' });
    }
    $('#app').innerHTML = `<div class="msg err">${esc(ptError(e))}</div><button class="btn block" data-act="reload">Tentar de novo</button><button class="btn block" data-act="logout">Sair</button>`;
  }
}
async function loadTrainer() {
  const since = new Date(Date.now() - 120 * 864e5).toISOString();
  [S.students, S.exercises, S.plans, S.logs] = await Promise.all([api.students(), api.exercises(), api.plans(), api.logs({ since })]);
}
async function loadStudent() {
  [S.plans, S.exercises, S.logs] = await Promise.all([api.plans(S.me.id), api.exercises(), api.logs({ studentId: S.me.id, limit: 200 })]);
}

const empty = (t, d) => `<div class="empty"><b>${esc(t)}</b>${esc(d)}</div>`;

function statusOf(s) {
  if (!s.user_id) return `<span class="st">⏳ Convite pendente</span>`;
  const last = logsOf(s.id)[0];
  if (!last) return `<span class="st warn">Ainda não treinou</span>`;
  const d = daysAgo(last.done_at);
  return `<span class="st ${d <= 3 ? 'ok' : d <= 7 ? 'warn' : 'bad'}">Treinou ${agoText(last.done_at)}</span>`;
}

/* ---------- validade do treino ---------- */
function validity(p) {
  if (!p || !p.ends_on) return null;
  const n = daysUntil(p.ends_on);
  if (n < 0) return { cls: 'bad', txt: `Vencido há ${-n} dia${n === -1 ? '' : 's'}`, n };
  if (n === 0) return { cls: 'warn', txt: 'Vence hoje', n };
  if (n <= 7) return { cls: 'warn', txt: `Vence em ${n} dia${n === 1 ? '' : 's'}`, n };
  return { cls: '', txt: `Válido até ${fmtDay(p.ends_on)}`, n };
}
const validityChip = p => { const v = validity(p); return v ? `<span class="st ${v.cls}">${v.cls ? '⚠️' : '📅'} ${v.txt}</span>` : ''; };
function renewalOf(s) { return plansOf(s.id).map(validity).filter(v => v && v.n <= 7).sort((a, b) => a.n - b.n)[0] || null; }

/* ---------- gráfico de evolução de carga ---------- */
const chartSel = {};
function loadSeries(logs) {
  const by = {};
  [...logs].sort((a, b) => new Date(a.done_at) - new Date(b.done_at)).forEach(l => (l.details || []).forEach(d => {
    const v = parseLoad(d.load); if (v == null) return;
    (by[d.name] ||= []).push({ t: l.done_at, v, raw: d.load });
  }));
  return by;
}
function loadChart(logs, key) {
  const by = loadSeries(logs);
  const names = Object.keys(by).sort((a, b) => by[b].length - by[a].length || a.localeCompare(b, 'pt'));
  const who = S.role === 'trainer' ? 'o aluno anotar' : 'você anotar';
  if (!names.length) return `<div class="card chart"><h3>Evolução de carga</h3><p class="muted" style="margin:6px 0 0">Aparece aqui quando ${who} a carga usada ao finalizar os treinos.</p></div>`;
  const sel = names.includes(chartSel[key]) ? chartSel[key] : names[0];
  const P = by[sel].slice(-20);
  const W = 320, H = 150, L = 36, R = 12, T = 10, B = 22;
  const vs = P.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo = Math.max(0, lo - 5); hi += 5; }
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const tstep = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw);
  lo = Math.max(0, Math.floor(lo / tstep) * tstep); hi = Math.ceil(hi / tstep) * tstep;
  const x = i => P.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (P.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = []; for (let t = lo; t <= hi + 1e-9; t += tstep) ticks.push(t);
  const step = P.length > 1 ? (W - L - R) / (P.length - 1) : W - L - R;
  const first = P[0], last = P[P.length - 1], diff = last.v - first.v;
  const pct = first.v ? Math.round(diff / first.v * 100) : 0;
  const tip = p => `${fmtShort(p.t)} · <b>${esc(p.raw)}</b>`;
  return `<div class="card chart" data-chart="${esc(key)}">
    <h3>Evolução de carga</h3>
    <div class="chips">${names.map(n => `<button class="chip ${n === sel ? 'on' : ''}" data-act="chartEx" data-key="${esc(key)}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p class="sum">${P.length > 1
      ? `<b>${esc(first.raw)} → ${esc(last.raw)}</b> <span class="muted">(${diff >= 0 ? '+' : ''}${fmtNum(diff)}${pct ? `, ${pct > 0 ? '+' : ''}${pct}%` : ''} em ${P.length} treinos)</span>`
      : `<b>${esc(first.raw)}</b> <span class="muted">— registre mais treinos para ver a evolução</span>`}</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga em ${esc(sel)} ao longo do tempo">
      ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmtNum(t)}</text>`).join('')}
      <text class="axis" x="${x(0)}" y="${H - 6}" text-anchor="${P.length === 1 ? 'middle' : 'start'}">${fmtShort(first.t)}</text>
      ${P.length > 1 ? `<text class="axis" x="${x(P.length - 1)}" y="${H - 6}" text-anchor="end">${fmtShort(last.t)}</text>` : ''}
      ${P.length > 1 ? `<path class="line" d="${P.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('')}"/>` : ''}
      ${P.map((p, i) => `<circle class="dot ${i === P.length - 1 ? 'on' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4"/>`).join('')}
      ${P.map((p, i) => `<rect class="hit" data-tip="${esc(tip(p))}" data-i="${i}" x="${(x(i) - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}"/>`).join('')}
    </svg>
    <div class="tip">Último: ${tip(last)} <span class="muted">· toque nos pontos para ver cada treino</span></div>
    <details><summary>Ver tabela</summary><table>${[...P].reverse().map(p => `<tr><td>${fmtShort(p.t)}</td><td>${esc(p.raw)}</td></tr>`).join('')}</table></details>
  </div>`;
}
function chartTip(el) {
  const c = el.closest('.chart'); if (!c) return;
  c.querySelector('.tip').innerHTML = el.dataset.tip;
  c.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === +el.dataset.i));
}
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('rect.hit'); if (el) chartTip(el); });
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('rect.hit'); if (el) chartTip(el); });

function statsHtml(logs) {
  const now = Date.now();
  const in7 = logs.filter(l => now - new Date(l.done_at) < 7 * 864e5).length;
  const l30 = logs.filter(l => now - new Date(l.done_at) < 30 * 864e5);
  const effs = l30.map(l => l.effort).filter(Boolean);
  const avg = effs.length ? fmtNum(effs.reduce((a, b) => a + b, 0) / effs.length) : '–';
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const end = now - i * 7 * 864e5, start = end - 7 * 864e5;
    return logs.filter(l => { const t = new Date(l.done_at).getTime(); return t > start && t <= end; }).length;
  }).reverse();
  const max = Math.max(3, ...weeks);
  return `<div class="stats">
      <div class="stat"><b>${in7}</b><small>treinos em 7 dias</small></div>
      <div class="stat"><b>${l30.length}</b><small>treinos em 30 dias</small></div>
      <div class="stat"><b>${avg}</b><small>esforço médio</small></div>
    </div>
    <div class="card"><small>Treinos por semana (últimas 8)</small>
      <div class="bars">${weeks.map((w, i) => `<div title="${w} treino(s)">${w || ''}<i style="height:${Math.round(w / max * 100)}%"></i></div>`).join('')}</div>
    </div>`;
}

  }

  S.logs.sort((a, b) => new Date(b.done_at) - new Date(a.done_at));

/* ===================== cronômetro de descanso ===================== */
let timerInt = null, timerEnd = 0, audioCtx = null;
function beep() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.25, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2);
    });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
}
function startTimer(sec) {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  timerEnd = Date.now() + sec * 1000;
  const el = $('#timer'); el.hidden = false;
  el.innerHTML = `<div>Descanso</div><div class="big" id="tBig"></div><div class="btns"><button data-act="tAdd">+15s</button><button data-act="tSkip">Pular</button></div>`;
  clearInterval(timerInt);
  const tick = () => {
    const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
    const b = $('#tBig'); if (b) b.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (left <= 0) {
      clearInterval(timerInt); beep();
      el.innerHTML = `<div class="big" style="font-size:44px">Bora! 🔥</div><div>Próxima série</div><div class="btns"><button data-act="tSkip">OK</button></div>`;
      setTimeout(() => { if (Date.now() - timerEnd > 2500) el.hidden = true; }, 3000);
    }
  };
  tick(); timerInt = setInterval(tick, 250);
}

function field(f, val) {
  const v = esc(val ?? '');
  if (f.type === 'textarea') return `<label>${esc(f.label)}</label><textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${v}</textarea>`;
  const list = f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
  return `<label>${esc(f.label)}</label><input name="${f.k}" type="${f.type || 'text'}" value="${v}" placeholder="${esc(f.ph || '')}" ${f.req ? 'required' : ''} ${f.list ? `list="dl_${f.k}"` : ''}>${list}`;
}
function formDialog(title, fields, values, onSave, extra = '', extraBtn = '') {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form class="dlg"><h3>${esc(title)}</h3>${fields.map(f => field(f, values[f.k])).join('')}${extra}
    <div class="actions">${extraBtn}<button type="button" class="btn" data-act="closeDlg">Cancelar</button><button class="btn primary">Salvar</button></div></form>`;
  const form = dlg.querySelector('form');
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('button.primary'); btn.disabled = true;
    const data = {}; fields.forEach(f => data[f.k] = form.elements[f.k].value.trim());
    try { await onSave(data); if (dlg.open) dlg.close(); }
    catch (er) { toast('Erro: ' + ptError(er)); btn.disabled = false; }
  };
  dlg.showModal();
  return form;
}
const studentFields = [
  { k: 'name', label: 'Nome do aluno', req: true, ph: 'Ex.: Maria Silva' },
  { k: 'goal', label: 'Objetivo', ph: 'Ex.: Hipertrofia, emagrecimento…', list: ['Hipertrofia', 'Emagrecimento', 'Condicionamento', 'Força', 'Reabilitação', 'Saúde e qualidade de vida'] },
  { k: 'notes', label: 'Observações (só você vê)', type: 'textarea', ph: 'Lesões, restrições, preferências…' }
];
function exerciseDialog(ex, after) {
  const isNew = !ex;
  const form = formDialog(isNew ? 'Novo exercício' : 'Editar exercício', [
    { k: 'name', label: 'Nome', req: true, ph: 'Ex.: Agachamento sumô' },
    { k: 'grp', label: 'Grupo muscular', list: groups(), ph: 'Ex.: Pernas' },
    { k: 'video', label: 'Link do seu vídeo (YouTube, Drive, Vimeo ou .mp4)', type: 'url', ph: 'https://youtu.be/…' },
    { k: 'notes', label: 'Como executar (aparece para o aluno)', type: 'textarea' }
  ], ex || {}, async d => {
    d.grp = d.grp || 'Outros';
    if (isNew) { const row = await api.addExercise(d); S.exercises.push(row); toast('Exercício salvo'); after ? after(row) : render(); }
    else { await api.updateExercise(ex.id, d); Object.assign(ex, d); toast('Exercício salvo'); render(); }
  }, `<div id="vprev"></div>`, isNew ? '' : `<button type="button" class="btn danger" data-act="delEx" data-id="${ex.id}" style="margin-right:auto">Excluir</button>`);
  const upd = () => {
    const e = videoEmbed(form.elements.video.value);
    $('#vprev').innerHTML = e ? `<div class="video">${e}</div>` : (form.elements.video.value ? '<p class="muted">Cole um link que comece com https://</p>' : '');
  };
  let t;
  form.elements.video.addEventListener('input', () => { clearTimeout(t); t = setTimeout(upd, 300); });
  upd();
}
function pickerDialog(plan) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg"><h3>Adicionar exercícios</h3>
    <input id="pq" type="search" placeholder="Buscar…" style="margin-top:10px">
    <div class="pick" id="plist"></div>
    <div class="actions"><button class="btn" data-act="pickNew" style="margin-right:auto">+ Cadastrar novo</button><button class="btn primary" data-act="closeDlg">Concluir</button></div></div>`;
  const draw = () => {
    const q = $('#pq').value.toLowerCase();
    $('#plist').innerHTML = S.exercises.filter(e => !q || e.name.toLowerCase().includes(q) || (e.grp || '').toLowerCase().includes(q))
      .sort((a, b) => (a.grp + a.name).localeCompare(b.grp + b.name, 'pt'))
      .map(e => { const c = plan.items.filter(i => i.ex === e.id).length;
        return `<button data-act="pick" data-id="${e.id}"><span><b>${esc(e.name)}</b><small>${esc(e.grp)}${e.video ? ' · 🎬' : ''}</small></span><span>${c ? '✓ ' + c : '+'}</span></button>`; }).join('')
      || `<p class="muted">Nenhum exercício. Cadastre na aba Exercícios ou aqui em “+ Cadastrar novo”.</p>`;
  };
  dlg._draw = draw; dlg._plan = plan;
  $('#pq').addEventListener('input', draw);
  draw();
  if (!dlg.open) dlg.showModal();
}
const BASIC = [['Agachamento livre', 'Pernas'], ['Leg press 45°', 'Pernas'], ['Cadeira extensora', 'Pernas'], ['Mesa flexora', 'Pernas'],
  ['Elevação pélvica', 'Glúteos'], ['Supino reto com barra', 'Peito'], ['Crucifixo com halteres', 'Peito'], ['Puxada frontal', 'Costas'],
  ['Remada baixa', 'Costas'], ['Desenvolvimento com halteres', 'Ombros'], ['Elevação lateral', 'Ombros'], ['Rosca direta', 'Bíceps'],
  ['Tríceps na polia', 'Tríceps'], ['Prancha abdominal', 'Abdômen'], ['Panturrilha em pé', 'Panturrilha']];
const newItem = ex => ({ ex, sets: '3', reps: '12', load: '', rest: '60', obs: '' });

/* ===================== ações ===================== */
const cur = () => ({ s: S.view.sid && studentById(S.view.sid), p: S.view.pid && S.plans.find(x => x.id === S.view.pid) });
const actions = {
  back: () => go($('#top')._back || { name: 'students' }),
  tab: el => { if (S.role === 'student') { S.view = { name: el.dataset.k }; render(); window.scrollTo(0, 0); } else go({ name: el.dataset.k }); },
  authTab: el => { authTab = el.dataset.k; authMsg = null; renderAuth(); },
  logout: async () => { flushPlanSave(); try { await api.signOut(); } catch {} resetState(); renderAuth(); },
  reload: () => location.reload(),
  becomeTrainer: () => formDialog('Seu perfil de personal', [{ k: 'name', label: 'Seu nome (aparece para os alunos)', req: true, ph: 'Ex.: Prof. Leo' }], {}, async d => {
    await api.createTrainer(d.name); $('#dlg').close(); await enter(S.user);
  }),
  // alunos
  newStudent: () => formDialog('Novo aluno', studentFields, {}, async d => {
    const s = await api.addStudent(d); S.students.push(s); S.students.sort((a, b) => a.name.localeCompare(b.name, 'pt'));
    $('#dlg').close(); go({ name: 'student', sid: s.id });
  }),
  openStudent: el => go({ name: 'student', sid: el.dataset.id }),
  editStudent: () => { const { s } = cur(); formDialog('Editar aluno', studentFields, s, async d => { await api.updateStudent(s.id, d); Object.assign(s, d); render(); }); },
  delStudent: async () => {
    const { s } = cur();
    if (!confirm(`Excluir ${s.name}, os treinos e todo o histórico? Não dá para desfazer.`)) return;
    await api.deleteStudent(s.id);
    S.students = S.students.filter(x => x !== s); S.plans = S.plans.filter(p => p.student_id !== s.id); S.logs = S.logs.filter(l => l.student_id !== s.id);
    go({ name: 'students' });
  },
  copyInvite: async () => { const { s } = cur(); try { await navigator.clipboard.writeText(inviteMsg(s)); toast('Mensagem copiada!'); } catch { prompt('Copie a mensagem:', inviteMsg(s)); } },
  resetInvite: async () => {
    const { s } = cur();
    if (!confirm(`Gerar um novo convite? ${s.name} perde o acesso até criar/entrar de novo pelo novo link.`)) return;
    s.invite_code = await api.resetInvite(s.id); s.user_id = null; render(); toast('Novo convite gerado');
  },
  // treinos
  newPlan: async () => {
    const { s } = cur(), ps = plansOf(s.id);
    const p = await api.addPlan({ student_id: s.id, name: 'Treino ' + String.fromCharCode(65 + ps.length), focus: '', position: ps.length, items: [], ends_on: localDay(Date.now() + 42 * 864e5) });
    S.plans.push(p); go({ name: 'plan', sid: s.id, pid: p.id });
  },
  openPlan: el => go({ name: 'plan', sid: S.view.sid, pid: el.dataset.id }),
  openPlanOf: el => go({ name: 'plan', sid: el.dataset.sid, pid: el.dataset.pid }),
  setEnds: el => { const { p } = cur(), w = +el.dataset.w; p.ends_on = w ? localDay(Date.now() + w * 7 * 864e5) : null; render(); queuePlanSave(p); toast(w ? `Válido até ${fmtDay(p.ends_on)}` : 'Treino sem validade'); },
  chartEx: el => { chartSel[el.dataset.key] = el.dataset.name; const c = el.closest('.chart'); const logs = S.role === 'trainer' ? logsOf(el.dataset.key) : [...store.get('mp_pending_' + S.user.id, []), ...S.logs]; c.outerHTML = loadChart(logs, el.dataset.key); },
  replyLog: el => {
    const l = S.logs.find(x => x.id === el.dataset.id), st = studentById(l.student_id);
    formDialog(`Responder ${st ? st.name.split(' ')[0] : 'aluno'}`,
      [{ k: 'reply', label: 'Sua resposta (aparece no histórico do aluno)', type: 'textarea', ph: 'Ex.: Ótimo treino! Na próxima, suba 2 kg no agachamento.' }],
      { reply: l.trainer_reply }, async d => {
        await api.replyLog(l.id, d.reply);
        Object.assign(l, { trainer_reply: d.reply, replied_at: d.reply ? new Date().toISOString() : null, trainer_seen: true });
        render(); toast(d.reply ? 'Resposta enviada ✓' : 'Resposta removida');
      }, l.comment ? `<p class="quote">Comentário: “${esc(l.comment)}”</p>` : '');
  },
  dupPlan: async () => {
    flushPlanSave();
    const { s, p } = cur();
    const c = await api.addPlan({ student_id: s.id, name: p.name + ' (cópia)', focus: p.focus, position: plansOf(s.id).length, items: p.items, ends_on: p.ends_on || null });
    S.plans.push(c); go({ name: 'plan', sid: s.id, pid: c.id }); toast('Treino duplicado');
  },
  delPlan: async () => {
    const { s, p } = cur(); if (!confirm(`Excluir ${p.name}?`)) return;
    clearTimeout(planSaveT); planSaveT = null;
    await api.deletePlan(p.id); S.plans = S.plans.filter(x => x !== p); go({ name: 'student', sid: s.id });
  },
  addItem: () => pickerDialog(cur().p),
  pick: el => { const dlg = $('#dlg'); dlg._plan.items.push(newItem(el.dataset.id)); queuePlanSave(dlg._plan); dlg._draw(); toast('Adicionado: ' + exById(el.dataset.id).name); },
  pickNew: () => { const plan = $('#dlg')._plan; $('#dlg').close(); exerciseDialog(null, ex => { plan.items.push(newItem(ex.id)); render(); queuePlanSave(plan); }); },
  closeDlg: () => { $('#dlg').close(); if (S.role === 'trainer' && S.view.name === 'plan') { render(); const el = $('#saving'); if (el && planSaveT) el.textContent = 'Salvando…'; } },
  moveItem: el => { const { p } = cur(); const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= p.items.length) return; [p.items[i], p.items[j]] = [p.items[j], p.items[i]]; render(); queuePlanSave(p); },
  delItem: el => { const { p } = cur(); p.items.splice(+el.dataset.i, 1); render(); queuePlanSave(p); },
  // acompanhamento
  seenAll: async () => { await markSeen(S.logs); render(); toast('Tudo marcado como visto'); },
  // exercícios
  newEx: () => exerciseDialog(null),
  editEx: el => exerciseDialog(exById(el.dataset.id)),
  seedEx: async () => { for (const [name, grp] of BASIC) S.exercises.push(await api.addExercise({ name, grp })); render(); toast('Exercícios adicionados — agora coloque seus vídeos'); },
  delEx: async el => {
    const id = el.dataset.id, using = S.plans.filter(p => (p.items || []).some(i => i.ex === id));
    if (!confirm(using.length ? `Este exercício está em ${using.length} treino(s) e será removido deles. Excluir mesmo assim?` : 'Excluir exercício?')) return;
    for (const p of using) { p.items = p.items.filter(i => i.ex !== id); await api.updatePlan(p.id, { items: p.items }); }
    await api.deleteExercise(id);
    S.exercises = S.exercises.filter(e => e.id !== id);
    $('#dlg').close(); render();
  },
  exGroup: el => { exFilter.g = el.dataset.g; render(); },
  import: () => $('#importFile').click(),
  // aluno
  curPlan: el => { curPlan = +el.dataset.k; render(); window.scrollTo(0, 0); },
  showVideo: el => { const i = +el.dataset.i, box = $('#v' + i); box.classList.remove('pending'); box.innerHTML = videoEmbed(exById(S.plans[curPlan].items[i].ex).video); },
  toggleSet: el => {
    const P = S.plans[curPlan], i = +el.dataset.i, k = +el.dataset.k, it = P.items[i];
    const pr = progress(P.id);
    pr.start ||= Date.now();
    const arr = pr.done[i] ||= [];
    arr[k] = !arr[k];
    store.set(progKey(P.id), pr);
    el.classList.toggle('done', arr[k]);
    $('#it' + i).classList.toggle('complete', arr.slice(0, nSets(it)).filter(Boolean).length >= nSets(it));
    updateProgress(P, pr);
    const rest = parseInt(it.rest) || 0;
    if (arr[k] && rest > 0) startTimer(rest);
  },
  finish: () => finishDialog(),
  tAdd: () => { timerEnd += 15000; },
  tSkip: () => { clearInterval(timerInt); $('#timer').hidden = true; }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !actions[el.dataset.act]) return;
  e.preventDefault();
  const r = actions[el.dataset.act](el);
  if (r && r.then) {
    el.disabled = true;
    r.catch(err => toast('Erro: ' + ptError(err))).finally(() => { el.disabled = false; });
  }
});
let trainerNameT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'exq') {
    exFilter.q = t.value; const pos = t.selectionStart; render();
    const n = $('#exq'); n.focus(); n.setSelectionRange(pos, pos); return;
  }
  if (t.dataset.load !== undefined && S.role === 'student') {
    const P = S.plans[curPlan], pr = progress(P.id); pr.loads[+t.dataset.load] = t.value; store.set(progKey(P.id), pr); return;
  }
  if (t.dataset.sf === 'name') {
    S.trainer.name = t.value; clearTimeout(trainerNameT);
    trainerNameT = setTimeout(() => api.updateTrainer(S.trainer.id, S.trainer.name).catch(er => toast('Erro: ' + ptError(er))), 700); return;
  }
  const { s, p } = cur();
  if (t.dataset.pf && p) { p[t.dataset.pf] = t.dataset.pf === 'ends_on' ? (t.value || null) : t.value; queuePlanSave(p); if (t.dataset.pf === 'name') $('#top h1').textContent = s.name + ' · ' + t.value; return; }
  if (t.dataset.f && p) { p.items[+t.dataset.i][t.dataset.f] = t.value; queuePlanSave(p); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  let d;
  try { d = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(d.exercises) || !Array.isArray(d.students)) throw 0; }
  catch { return alert('Arquivo de backup inválido.'); }
  if (!confirm(`Importar ${d.exercises.length} exercícios e ${d.students.length} alunos?`)) return;
  try {
    toast('Importando…');
    const map = {};
    for (const x of d.exercises) {
      const found = S.exercises.find(y => y.name.toLowerCase() === (x.name || '').toLowerCase());
      const row = found || await api.addExercise({ name: x.name, grp: x.group || 'Outros', video: x.video || '', notes: x.notes || '' });
      if (found && !found.video && x.video) { await api.updateExercise(found.id, { video: x.video }); found.video = x.video; }
      if (!found) S.exercises.push(row);
      map[x.id] = row.id;
    }
    for (const st of d.students) {
      const s = await api.addStudent({ name: st.name, goal: st.goal || '', notes: st.notes || '' });
      S.students.push(s);
      for (const [i, p] of (st.plans || []).entries()) {
        S.plans.push(await api.addPlan({ student_id: s.id, name: p.name, focus: p.focus || '', position: i,
          items: (p.items || []).filter(it => map[it.exId]).map(it => ({ ex: map[it.exId], sets: it.sets, reps: it.reps, load: it.load, rest: it.rest, obs: it.obs })) }));
      }
    }
    render(); toast('Importação concluída ✓');
  } catch (er) { alert('Erro na importação: ' + ptError(er)); render(); }
});

boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
