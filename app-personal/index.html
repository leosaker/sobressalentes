<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Personal</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface2:#eef2f5; --text:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --primary:#0f766e; --primary-ink:#fff; --accent:#14b8a6; --danger:#dc2626;
  --done:#16a34a; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121a2b; --surface2:#1a2438; --text:#e5e9f0; --muted:#94a3b8;
    --line:#243049; --primary:#14b8a6; --primary-ink:#04201d; --accent:#2dd4bf; --danger:#f87171;
    --done:#22c55e; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--primary);font-weight:600}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0}
small,.muted{color:var(--muted);font-size:13px}
small{display:block}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.card{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);font:inherit}
button.card{cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:22px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none}
.btn{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%;margin-bottom:10px}
.btn:disabled{opacity:.5}
.icon{background:var(--surface2);border:0;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;flex:none;cursor:pointer}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 8px}
.grid4 label{margin:0 0 3px}
.grid4 input{padding:8px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.group-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.video{margin-top:10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.video iframe,.video video{width:100%;height:100%;border:0;display:block}
.video.pending{background:var(--surface2);aspect-ratio:auto}
.video.pending button{width:100%;padding:14px;background:none;border:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer}
.presc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presc span{background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.obs{background:color-mix(in srgb,var(--accent) 12%,transparent);border-left:3px solid var(--accent);padding:8px 10px;border-radius:8px;margin:10px 0 0;font-size:14px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.set.done{background:var(--done);border-color:var(--done);color:#fff}
.item.complete{border-color:var(--done)}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--done);transition:width .3s}
details{margin-top:8px;font-size:14px}
summary{color:var(--primary);cursor:pointer}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(2,6,23,.55)}
.dlg{padding:18px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pick{max-height:50dvh;overflow:auto;margin-top:10px}
.pick button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.share-link{word-break:break-all;font-size:12px;background:var(--surface2);padding:10px;border-radius:10px;max-height:90px;overflow:auto}
#timer{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#timer[hidden]{display:none}
#timer .big{font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#timer .btns{display:flex;gap:10px}
#timer button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.hello{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px}
.hello h2{color:#fff}
.hello small{color:rgba(255,255,255,.85)}
.footer-link{display:block;text-align:center;margin:26px 0 8px;color:var(--muted);font-size:13px;background:none;border:0;width:100%;font-family:inherit}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="tabs"></nav>
<dialog id="dlg"></dialog>
<div id="timer" hidden></div>
<div id="toast"></div>

<script>
/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR');

const store = {
  mem: {},
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return k in this.mem ? this.mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { this.mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch { delete this.mem[k]; } }
};

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===================== vídeos ===================== */
function videoEmbed(url) {
  url = (url || '').trim();
  if (!/^https:\/\//i.test(url)) return '';
  let m;
  const ifr = src => `<iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)))
    return ifr(`https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1&modestbranding=1`);
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/)))
    return ifr(`https://player.vimeo.com/video/${m[1]}${m[2] ? '?h=' + m[2] : ''}`);
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/)))
    return ifr(`https://drive.google.com/file/d/${m[1]}/preview`);
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url))
    return `<video src="${esc(url)}" controls playsinline preload="metadata"></video>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" style="display:block;padding:14px;color:#fff">Abrir vídeo ↗</a>`;
}

/* ===================== link do aluno (dados no próprio link) ===================== */
function b64u(u8) { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function encode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try {
      const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
    } catch {}
  }
  return 'j' + b64u(bytes);
}
async function decode(str) {
  let bytes = unb64u(str.slice(1));
  if (str[0] === 'z') {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ===================== dados do personal ===================== */
function seed() {
  const ex = (name, group, notes = '') => ({ id: uid(), name, group, video: '', notes });
  return {
    trainer: '',
    exercises: [
      ex('Agachamento livre', 'Pernas', 'Pés na largura dos ombros, coluna neutra, desça até a coxa ficar paralela ao chão.'),
      ex('Leg press 45°', 'Pernas'),
      ex('Cadeira extensora', 'Pernas'),
      ex('Mesa flexora', 'Pernas'),
      ex('Elevação pélvica', 'Glúteos'),
      ex('Supino reto com barra', 'Peito'),
      ex('Crucifixo com halteres', 'Peito'),
      ex('Puxada frontal', 'Costas'),
      ex('Remada baixa', 'Costas'),
      ex('Desenvolvimento com halteres', 'Ombros'),
      ex('Elevação lateral', 'Ombros'),
      ex('Rosca direta', 'Bíceps'),
      ex('Tríceps na polia', 'Tríceps'),
      ex('Prancha abdominal', 'Abdômen', 'Mantenha o quadril alinhado e o abdômen contraído.'),
      ex('Panturrilha em pé', 'Panturrilha'),
    ],
    students: []
  };
}
let db = store.get('mp_db', null) || seed();
const save = () => store.set('mp_db', db);
const exById = id => db.exercises.find(e => e.id === id);
const groups = () => [...new Set(db.exercises.map(e => e.group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));

/* ===================== estado de navegação ===================== */
let mode = 'trainer';          // 'trainer' | 'aluno'
let view = { name: 'students' };
let aluno = null;              // pacote de treino que o aluno recebeu
let alunoPreview = false;      // personal vendo como aluno
let alunoPlan = 0;
let exFilter = { q: '', g: '' };

function go(v) { view = v; render(); window.scrollTo(0, 0); }

/* ===================== render ===================== */
function render() {
  if (mode === 'aluno') return renderAluno();
  const v = view;
  const s = v.sid && db.students.find(x => x.id === v.sid);
  const p = s && v.pid && s.plans.find(x => x.id === v.pid);
  let title = 'Meu Personal', back = null, html = '';
  if (v.name === 'students') html = vStudents();
  else if (v.name === 'student' && s) { title = s.name; back = { name: 'students' }; html = vStudent(s); }
  else if (v.name === 'plan' && p) { title = s.name + ' · ' + p.name; back = { name: 'student', sid: s.id }; html = vPlan(s, p); }
  else if (v.name === 'exercises') { title = 'Biblioteca de exercícios'; html = vExercises(); }
  else if (v.name === 'settings') { title = 'Configurações'; html = vSettings(); }
  else { view = { name: 'students' }; return render(); }
  $('#top').innerHTML = `${back ? `<button data-act="back">‹ Voltar</button>` : ''}<h1>${esc(title)}</h1>`;
  $('#top')._back = back;
  $('#app').innerHTML = html;
  const tab = ['students', 'student', 'plan'].includes(v.name) ? 'students' : v.name;
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = [['students', '👥', 'Alunos'], ['exercises', '🎬', 'Exercícios'], ['settings', '⚙️', 'Ajustes']]
    .map(([k, i, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-k="${k}"><span>${i}</span>${l}</button>`).join('');
}

const empty = (t, d) => `<div class="empty"><b>${esc(t)}</b>${esc(d)}</div>`;

function vStudents() {
  const list = db.students.map(s => `
    <button class="card row" data-act="openStudent" data-id="${s.id}">
      <div class="avatar">${esc(initials(s.name))}</div>
      <div class="grow"><b>${esc(s.name)}</b><small>${esc(s.goal || 'Sem objetivo definido')} · ${s.plans.length} treino(s)</small></div>
      <span class="chev">›</span>
    </button>`).join('');
  return `<div class="toolbar"><h2>Alunos</h2><button class="btn primary" data-act="newStudent">+ Novo aluno</button></div>
    ${list || empty('Nenhum aluno ainda', 'Cadastre seu primeiro aluno para montar as séries dele.')}`;
}

function vStudent(s) {
  const plans = s.plans.map(p => `
    <button class="card row" data-act="openPlan" data-id="${p.id}">
      <div class="avatar">${esc(p.name.replace(/^Treino\s*/i, '').slice(0, 2) || 'T')}</div>
      <div class="grow"><b>${esc(p.name)}</b><small>${p.items.length} exercício(s)${p.focus ? ' · ' + esc(p.focus) : ''}</small></div>
      <span class="chev">›</span>
    </button>`).join('');
  return `
    <div class="card"><div class="row"><div class="avatar">${esc(initials(s.name))}</div>
      <div class="grow"><h3>${esc(s.name)}</h3><small>${esc(s.goal || 'Sem objetivo definido')}</small></div>
      <button class="icon" data-act="editStudent" aria-label="Editar aluno">✎</button></div>
      ${s.notes ? `<p class="muted" style="margin:10px 0 0">${esc(s.notes)}</p>` : ''}
    </div>
    <div class="toolbar"><h2>Treinos</h2><button class="btn" data-act="newPlan">+ Novo treino</button></div>
    ${plans || empty('Nenhum treino', 'Crie o Treino A, B, C… e adicione os exercícios.')}
    <button class="btn primary block" data-act="share" ${s.plans.length ? '' : 'disabled'}>📲 Enviar treino para o aluno</button>
    <button class="btn block" data-act="preview" ${s.plans.length ? '' : 'disabled'}>👀 Ver como o aluno vai ver</button>
    <button class="btn block danger" data-act="delStudent">Excluir aluno</button>`;
}

function vPlan(s, p) {
  const items = p.items.map((it, i) => {
    const ex = exById(it.exId);
    return `<div class="card item">
      <div class="row">
        <div class="grow"><b>${i + 1}. ${esc(ex ? ex.name : 'Exercício removido')}</b>
          <small>${esc(ex ? ex.group : '')}${ex && ex.video ? ' · 🎬 com vídeo' : ' · sem vídeo'}</small></div>
        <button class="icon" data-act="moveItem" data-i="${i}" data-d="-1" aria-label="Subir">↑</button>
        <button class="icon" data-act="moveItem" data-i="${i}" data-d="1" aria-label="Descer">↓</button>
        <button class="icon" data-act="delItem" data-i="${i}" aria-label="Remover">✕</button>
      </div>
      <div class="grid4">
        <div><label>Séries</label><input inputmode="numeric" data-i="${i}" data-f="sets" value="${esc(it.sets)}"></div>
        <div><label>Reps</label><input data-i="${i}" data-f="reps" value="${esc(it.reps)}" placeholder="12"></div>
        <div><label>Carga</label><input data-i="${i}" data-f="load" value="${esc(it.load)}" placeholder="kg"></div>
        <div><label>Desc. (s)</label><input inputmode="numeric" data-i="${i}" data-f="rest" value="${esc(it.rest)}"></div>
      </div>
      <input data-i="${i}" data-f="obs" value="${esc(it.obs)}" placeholder="Observação (ex.: cadência 3-0-1, drop-set na última)">
    </div>`;
  }).join('');
  return `
    <label>Nome do treino</label><input data-pf="name" value="${esc(p.name)}">
    <label>Foco / descrição</label><input data-pf="focus" value="${esc(p.focus || '')}" placeholder="Ex.: Inferiores + core">
    <div class="toolbar" style="margin-top:18px"><h2>Exercícios</h2><button class="btn primary" data-act="addItem">+ Adicionar</button></div>
    ${items || empty('Treino vazio', 'Toque em “+ Adicionar” e escolha os exercícios da sua biblioteca.')}
    <button class="btn block" data-act="dupPlan">Duplicar treino</button>
    <button class="btn block danger" data-act="delPlan">Excluir treino</button>`;
}

function vExercises() {
  const q = exFilter.q.toLowerCase();
  const list = db.exercises.filter(e => (!exFilter.g || e.group === exFilter.g) && (!q || e.name.toLowerCase().includes(q)));
  const byG = {};
  list.forEach(e => (byG[e.group || 'Outros'] ||= []).push(e));
  const body = Object.keys(byG).sort((a, b) => a.localeCompare(b, 'pt')).map(g => `
    <div class="group-title">${esc(g)}</div>
    ${byG[g].sort((a, b) => a.name.localeCompare(b.name, 'pt')).map(e => `
      <button class="card row" data-act="editEx" data-id="${e.id}">
        <div class="grow"><b>${esc(e.name)}</b><small>${e.video ? '🎬 vídeo cadastrado' : '⚠️ sem vídeo'}</small></div><span class="chev">›</span>
      </button>`).join('')}`).join('');
  const noVideo = db.exercises.filter(e => !e.video).length;
  return `<div class="toolbar"><h2>Exercícios</h2><button class="btn primary" data-act="newEx">+ Novo</button></div>
    ${noVideo ? `<p class="muted" style="margin-top:-6px">${noVideo} exercício(s) ainda sem o seu vídeo.</p>` : ''}
    <input id="exq" type="search" placeholder="Buscar exercício…" value="${esc(exFilter.q)}">
    <div class="chips" style="margin-top:10px">
      <button class="chip ${!exFilter.g ? 'on' : ''}" data-act="exGroup" data-g="">Todos</button>
      ${groups().map(g => `<button class="chip ${exFilter.g === g ? 'on' : ''}" data-act="exGroup" data-g="${esc(g)}">${esc(g)}</button>`).join('')}
    </div>
    <div id="exlist">${body || empty('Nada encontrado', 'Tente outra busca ou cadastre um novo exercício.')}</div>`;
}

function vSettings() {
  return `
    <div class="card"><h3>Seu perfil</h3>
      <label>Seu nome (aparece para o aluno)</label><input data-sf="trainer" value="${esc(db.trainer)}" placeholder="Ex.: Prof. Leo">
    </div>
    <div class="card"><h3>Como colocar seus vídeos</h3>
      <p class="muted" style="margin:8px 0 0">1. Grave o vídeo do exercício no celular.<br>
      2. Suba no <b>YouTube como “Não listado”</b> (só quem tem o link vê) — ou no Google Drive / Vimeo.<br>
      3. Copie o link e cole no exercício, na aba 🎬 Exercícios.<br>
      O vídeo aparece dentro do treino do aluno, com o player embutido.</p>
    </div>
    <div class="card"><h3>Backup</h3>
      <p class="muted" style="margin:8px 0 10px">Seus dados ficam salvos neste aparelho. Faça backup de vez em quando ou para passar para outro celular/computador.</p>
      <button class="btn block" data-act="export">⬇️ Baixar backup</button>
      <button class="btn block" data-act="import">⬆️ Restaurar backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>`;
}

/* ===================== tela do aluno ===================== */
const alunoKey = () => 'mp_a_' + (aluno ? (aluno.s || '').toLowerCase().replace(/\W+/g, '_') : '');
function progress() {
  const k = alunoKey() + '_prog_' + alunoPlan;
  const pr = store.get(k, null);
  return pr && pr.date === today() ? pr : { date: today(), done: {} };
}
function saveProgress(pr) { if (!alunoPreview) store.set(alunoKey() + '_prog_' + alunoPlan, pr); else progress._mem = pr; }
function workoutHist() { return alunoPreview ? [] : store.get(alunoKey() + '_hist', []); }

function renderAluno() {
  const A = aluno;
  $('#tabs').hidden = true;
  $('#tabs').innerHTML = '';
  $('#top').innerHTML = `${alunoPreview ? `<button data-act="exitPreview">‹ Sair</button>` : ''}<h1>${alunoPreview ? 'Pré-visualização do aluno' : 'Meu Treino'}</h1>`;
  if (!A || !A.p || !A.p.length) { $('#app').innerHTML = empty('Nenhum treino', 'Peça para seu personal enviar o link do treino.'); return; }
  if (alunoPlan >= A.p.length) alunoPlan = 0;
  const P = A.p[alunoPlan];
  const pr = alunoPreview ? (progress._mem && progress._mem.plan === alunoPlan ? progress._mem : { date: today(), done: {}, plan: alunoPlan }) : progress();
  const hist = workoutHist();
  const last = hist[hist.length - 1];
  const items = P.i.map((it, i) => {
    const n = Math.min(Math.max(parseInt(it.s) || 3, 1), 12);
    const done = pr.done[i] || [];
    const complete = done.filter(Boolean).length >= n;
    return `<div class="card item ${complete ? 'complete' : ''}" id="it${i}">
      <h3>${i + 1}. ${esc(it.n)}</h3><small>${esc(it.g || '')}</small>
      <div class="presc"><span>${n} séries</span><span>${esc(it.r || '-')} reps</span>${it.l ? `<span>🏋️ ${esc(it.l)}</span>` : ''}${parseInt(it.rt) ? `<span>⏱ ${parseInt(it.rt)}s descanso</span>` : ''}</div>
      ${it.o ? `<p class="obs">${esc(it.o)}</p>` : ''}
      ${videoEmbed(it.v) ? `<div class="video pending" id="v${i}"><button data-act="showVideo" data-i="${i}">▶ Ver vídeo de execução</button></div>` : ''}
      ${it.d ? `<details><summary>Como executar</summary><p style="margin:6px 0 0">${esc(it.d)}</p></details>` : ''}
      <div class="sets">${Array.from({ length: n }, (_, k) => `<button class="set ${done[k] ? 'done' : ''}" data-act="toggleSet" data-i="${i}" data-k="${k}" aria-label="Série ${k + 1}">${k + 1}</button>`).join('')}</div>
    </div>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="hello"><h2>Olá, ${esc((A.s || '').split(' ')[0] || 'aluno')}! 💪</h2>
      <small>${A.t ? 'Treino montado por ' + esc(A.t) : 'Seu treino personalizado'}${A.g ? ' · ' + esc(A.g) : ''}</small>
      ${last ? `<small style="margin-top:6px">${hist.length} treino(s) concluído(s) · último em ${fmtDate(last.date)} (${esc(last.plan)})</small>` : ''}
    </div>
    ${A.p.length > 1 ? `<div class="chips">${A.p.map((p, k) => `<button class="chip ${k === alunoPlan ? 'on' : ''}" data-act="alunoPlan" data-k="${k}">${esc(p.n)}</button>`).join('')}</div>` : ''}
    ${P.f ? `<p class="muted" style="margin:0 0 6px">${esc(P.f)}</p>` : ''}
    <div class="muted" id="progTxt"></div><div class="progress"><i id="progBar"></i></div>
    ${items || empty('Treino vazio', 'Seu personal ainda não adicionou exercícios aqui.')}
    ${P.i.length ? `<button class="btn primary block" data-act="finish">✅ Finalizar treino</button>` : ''}
    <p class="muted" style="text-align:center">Toque no número da série quando terminar — o descanso começa sozinho.</p>
    ${!alunoPreview ? `<button class="footer-link" data-act="trainerMode">Área do personal</button>` : ''}`;
  updateProgress(pr);
}
function updateProgress(pr) {
  const P = aluno.p[alunoPlan];
  let total = 0, d = 0;
  P.i.forEach((it, i) => { const n = Math.min(Math.max(parseInt(it.s) || 3, 1), 12); total += n; d += (pr.done[i] || []).slice(0, n).filter(Boolean).length; });
  const pct = total ? Math.round(d / total * 100) : 0;
  const bar = $('#progBar'), txt = $('#progTxt');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = `${d} de ${total} séries feitas hoje (${pct}%)`;
}

/* ===================== cronômetro de descanso ===================== */
let timerInt = null, timerEnd = 0, audioCtx = null;
function beep() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.25, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2);
    });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
}
function startTimer(sec) {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  timerEnd = Date.now() + sec * 1000;
  const el = $('#timer'); el.hidden = false;
  el.innerHTML = `<div>Descanso</div><div class="big" id="tBig"></div><div class="btns"><button data-act="tAdd">+15s</button><button data-act="tSkip">Pular</button></div>`;
  clearInterval(timerInt);
  const tick = () => {
    const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
    const b = $('#tBig'); if (b) b.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (left <= 0) {
      clearInterval(timerInt); beep();
      el.innerHTML = `<div class="big" style="font-size:44px">Bora! 🔥</div><div>Próxima série</div><div class="btns"><button data-act="tSkip">OK</button></div>`;
      setTimeout(() => { if (Date.now() - timerEnd > 2500) el.hidden = true; }, 3000);
    }
  };
  tick(); timerInt = setInterval(tick, 250);
}

/* ===================== diálogos ===================== */
function field(f, val) {
  const v = esc(val ?? '');
  if (f.type === 'textarea') return `<label>${esc(f.label)}</label><textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${v}</textarea>`;
  const list = f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
  return `<label>${esc(f.label)}</label><input name="${f.k}" type="${f.type || 'text'}" value="${v}" placeholder="${esc(f.ph || '')}" ${f.req ? 'required' : ''} ${f.list ? `list="dl_${f.k}"` : ''}>${list}`;
}
function formDialog(title, fields, values, onSave, extra = '', extraBtn = '') {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" class="dlg"><h3>${esc(title)}</h3>${fields.map(f => field(f, values[f.k])).join('')}${extra}
    <div class="actions">${extraBtn}<button value="cancel" class="btn" formnovalidate>Cancelar</button><button value="ok" class="btn primary">Salvar</button></div></form>`;
  const form = dlg.querySelector('form');
  form.onsubmit = e => {
    if (!e.submitter || e.submitter.value !== 'ok') return;
    const data = {}; fields.forEach(f => data[f.k] = form.elements[f.k].value.trim());
    onSave(data);
  };
  dlg.showModal();
  return form;
}
const studentFields = [
  { k: 'name', label: 'Nome do aluno', req: true, ph: 'Ex.: Maria Silva' },
  { k: 'goal', label: 'Objetivo', ph: 'Ex.: Hipertrofia, emagrecimento…', list: ['Hipertrofia', 'Emagrecimento', 'Condicionamento', 'Força', 'Reabilitação', 'Saúde e qualidade de vida'] },
  { k: 'notes', label: 'Observações (só você vê)', type: 'textarea', ph: 'Lesões, restrições, preferências…' }
];
function exerciseDialog(ex, after) {
  const isNew = !ex;
  ex ||= { id: uid(), name: '', group: '', video: '', notes: '' };
  const form = formDialog(isNew ? 'Novo exercício' : 'Editar exercício', [
    { k: 'name', label: 'Nome', req: true, ph: 'Ex.: Agachamento sumô' },
    { k: 'group', label: 'Grupo muscular', list: groups(), ph: 'Ex.: Pernas' },
    { k: 'video', label: 'Link do seu vídeo (YouTube, Drive, Vimeo ou .mp4)', type: 'url', ph: 'https://youtu.be/…' },
    { k: 'notes', label: 'Como executar (aparece para o aluno)', type: 'textarea' }
  ], ex, d => {
    Object.assign(ex, d, { group: d.group || 'Outros' });
    if (isNew) db.exercises.push(ex);
    save(); toast('Exercício salvo'); after ? after(ex) : render();
  }, `<div id="vprev"></div>`, isNew ? '' : `<button type="button" class="btn danger" data-act="delEx" data-id="${ex.id}" style="margin-right:auto">Excluir</button>`);
  const upd = () => {
    const e = videoEmbed(form.elements.video.value);
    $('#vprev').innerHTML = e ? `<div class="video">${e}</div>` : (form.elements.video.value ? '<p class="muted">Cole um link que comece com https://</p>' : '');
  };
  let t;
  form.elements.video.addEventListener('input', () => { clearTimeout(t); t = setTimeout(upd, 300); });
  upd();
}
function pickerDialog(plan) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg"><h3>Adicionar exercícios</h3>
    <input id="pq" type="search" placeholder="Buscar…" style="margin-top:10px">
    <div class="pick" id="plist"></div>
    <div class="actions"><button class="btn" data-act="pickNew" style="margin-right:auto">+ Cadastrar novo</button><button class="btn primary" data-act="closeDlg">Concluir</button></div></div>`;
  const draw = () => {
    const q = $('#pq').value.toLowerCase();
    $('#plist').innerHTML = db.exercises.filter(e => !q || e.name.toLowerCase().includes(q) || (e.group || '').toLowerCase().includes(q))
      .sort((a, b) => (a.group + a.name).localeCompare(b.group + b.name, 'pt'))
      .map(e => { const c = plan.items.filter(i => i.exId === e.id).length;
        return `<button data-act="pick" data-id="${e.id}"><span><b>${esc(e.name)}</b><small>${esc(e.group)}${e.video ? ' · 🎬' : ''}</small></span><span>${c ? '✓ ' + c : '+'}</span></button>`; }).join('');
  };
  dlg._draw = draw; dlg._plan = plan;
  $('#pq').addEventListener('input', draw);
  draw();
  if (!dlg.open) dlg.showModal();
}
function payloadFor(s) {
  return {
    v: 1, t: db.trainer, s: s.name, g: s.goal, at: Date.now(),
    p: s.plans.map(p => ({ n: p.name, f: p.focus || '', i: p.items.map(it => { const e = exById(it.exId) || {};
      return { n: e.name || 'Exercício', g: e.group || '', v: e.video || '', d: e.notes || '', s: it.sets, r: it.reps, l: it.load, rt: it.rest, o: it.obs }; }) }))
  };
}
async function shareDialog(s) {
  const code = await encode(payloadFor(s));
  const base = location.href.split('#')[0].split('?')[0];
  const link = base + '#a=' + code;
  const msg = `Olá ${s.name.split(' ')[0]}! Seu treino está pronto 💪\nAbra no celular (dá para adicionar à tela inicial):\n${link}`;
  const hosted = /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname);
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg"><h3>Enviar treino para ${esc(s.name)}</h3>
    <p class="muted">O treino completo vai dentro do link. Sempre que você alterar o treino, envie o link de novo.</p>
    ${hosted ? '' : `<p class="obs">⚠️ Para o aluno abrir o link, o app precisa estar publicado na internet (veja o LEIA-ME). Por enquanto, use “Ver como o aluno” para testar.</p>`}
    <div class="share-link">${esc(link)}</div>
    <div class="actions">
      <a class="btn" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp</a>
      <button class="btn" data-act="copyLink">Copiar link</button>
      ${navigator.share ? `<button class="btn" data-act="nativeShare">Compartilhar…</button>` : ''}
      <button class="btn primary" data-act="closeDlg">Fechar</button>
    </div></div>`;
  dlg._link = link; dlg._msg = msg;
  dlg.showModal();
}

/* ===================== ações ===================== */
const cur = () => {
  const s = view.sid && db.students.find(x => x.id === view.sid);
  return { s, p: s && view.pid && s.plans.find(x => x.id === view.pid) };
};
const actions = {
  back: () => go($('#top')._back || { name: 'students' }),
  tab: el => go({ name: el.dataset.k }),
  newStudent: () => formDialog('Novo aluno', studentFields, {}, d => {
    const s = { id: uid(), ...d, plans: [] }; db.students.push(s); save(); go({ name: 'student', sid: s.id });
  }),
  openStudent: el => go({ name: 'student', sid: el.dataset.id }),
  editStudent: () => { const { s } = cur(); formDialog('Editar aluno', studentFields, s, d => { Object.assign(s, d); save(); render(); }); },
  delStudent: () => { const { s } = cur(); if (confirm(`Excluir ${s.name} e todos os treinos dele?`)) { db.students = db.students.filter(x => x !== s); save(); go({ name: 'students' }); } },
  newPlan: () => {
    const { s } = cur();
    const p = { id: uid(), name: 'Treino ' + String.fromCharCode(65 + s.plans.length), focus: '', items: [] };
    s.plans.push(p); save(); go({ name: 'plan', sid: s.id, pid: p.id });
  },
  openPlan: el => go({ name: 'plan', sid: view.sid, pid: el.dataset.id }),
  dupPlan: () => { const { s, p } = cur(); const c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name += ' (cópia)'; s.plans.push(c); save(); go({ name: 'plan', sid: s.id, pid: c.id }); toast('Treino duplicado'); },
  delPlan: () => { const { s, p } = cur(); if (confirm(`Excluir ${p.name}?`)) { s.plans = s.plans.filter(x => x !== p); save(); go({ name: 'student', sid: s.id }); } },
  addItem: () => pickerDialog(cur().p),
  pick: el => {
    const dlg = $('#dlg'); dlg._plan.items.push({ exId: el.dataset.id, sets: '3', reps: '12', load: '', rest: '60', obs: '' });
    save(); dlg._draw(); toast('Adicionado: ' + exById(el.dataset.id).name);
  },
  pickNew: () => { const plan = $('#dlg')._plan; $('#dlg').close(); exerciseDialog(null, ex => { plan.items.push({ exId: ex.id, sets: '3', reps: '12', load: '', rest: '60', obs: '' }); save(); render(); }); },
  closeDlg: () => { $('#dlg').close(); if (mode === 'trainer') render(); },
  moveItem: el => { const { p } = cur(); const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= p.items.length) return; [p.items[i], p.items[j]] = [p.items[j], p.items[i]]; save(); render(); },
  delItem: el => { const { p } = cur(); p.items.splice(+el.dataset.i, 1); save(); render(); },
  newEx: () => exerciseDialog(null),
  editEx: el => exerciseDialog(exById(el.dataset.id)),
  delEx: el => {
    const id = el.dataset.id, used = db.students.some(s => s.plans.some(p => p.items.some(i => i.exId === id)));
    if (!confirm(used ? 'Este exercício está em treinos de alunos e será removido deles. Excluir mesmo assim?' : 'Excluir exercício?')) return;
    db.exercises = db.exercises.filter(e => e.id !== id);
    db.students.forEach(s => s.plans.forEach(p => p.items = p.items.filter(i => i.exId !== id)));
    save(); $('#dlg').close(); render();
  },
  exGroup: el => { exFilter.g = el.dataset.g; render(); },
  share: () => shareDialog(cur().s),
  copyLink: async () => { try { await navigator.clipboard.writeText($('#dlg')._msg); toast('Mensagem com link copiada!'); } catch { prompt('Copie o link:', $('#dlg')._link); } },
  nativeShare: () => navigator.share({ title: 'Seu treino', text: $('#dlg')._msg }).catch(() => {}),
  preview: () => { aluno = payloadFor(cur().s); alunoPreview = true; alunoPlan = 0; progress._mem = null; mode = 'aluno'; render(); window.scrollTo(0, 0); },
  exitPreview: () => { mode = 'trainer'; alunoPreview = false; aluno = null; render(); },
  trainerMode: () => { if (confirm('A área do personal é para montar treinos. Abrir mesmo assim?')) { mode = 'trainer'; render(); } },
  alunoPlan: el => { alunoPlan = +el.dataset.k; render(); window.scrollTo(0, 0); },
  showVideo: el => { const i = +el.dataset.i, box = $('#v' + i); box.classList.remove('pending'); box.innerHTML = videoEmbed(aluno.p[alunoPlan].i[i].v); },
  toggleSet: el => {
    const i = +el.dataset.i, k = +el.dataset.k, it = aluno.p[alunoPlan].i[i];
    const pr = alunoPreview ? (progress._mem && progress._mem.plan === alunoPlan ? progress._mem : { date: today(), done: {}, plan: alunoPlan }) : progress();
    const arr = pr.done[i] ||= [];
    arr[k] = !arr[k];
    saveProgress(pr);
    el.classList.toggle('done', arr[k]);
    const n = Math.min(Math.max(parseInt(it.s) || 3, 1), 12);
    $('#it' + i).classList.toggle('complete', arr.slice(0, n).filter(Boolean).length >= n);
    updateProgress(pr);
    const rest = parseInt(it.rt) || 0;
    if (arr[k] && rest > 0) startTimer(rest);
  },
  finish: () => {
    const P = aluno.p[alunoPlan];
    if (!alunoPreview) {
      const h = workoutHist(); h.push({ date: today(), plan: P.n }); store.set(alunoKey() + '_hist', h);
      store.del(alunoKey() + '_prog_' + alunoPlan);
    } else progress._mem = null;
    render(); window.scrollTo(0, 0);
    toast(`${P.n} concluído! Mandou bem 🎉`);
  },
  tAdd: () => { timerEnd += 15000; },
  tSkip: () => { clearInterval(timerInt); $('#timer').hidden = true; },
  export: () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-treinos-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  import: () => $('#importFile').click()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !actions[el.dataset.act]) return;
  e.preventDefault();
  actions[el.dataset.act](el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'exq') {
    exFilter.q = t.value; const pos = t.selectionStart; render();
    const n = $('#exq'); n.focus(); n.setSelectionRange(pos, pos); return;
  }
  if (t.dataset.sf) { db[t.dataset.sf] = t.value; save(); return; }
  const { s, p } = cur();
  if (t.dataset.pf && p) { p[t.dataset.pf] = t.value; save(); if (t.dataset.pf === 'name') $('#top h1').textContent = s.name + ' · ' + t.value; return; }
  if (t.dataset.f && p) { p.items[+t.dataset.i][t.dataset.f] = t.value; save(); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.exercises) || !Array.isArray(d.students)) throw 0;
    if (!confirm('Substituir os dados atuais por este backup?')) return;
    db = d; save(); render(); toast('Backup restaurado');
  } catch { alert('Arquivo de backup inválido.'); }
});

/* ===================== início ===================== */
(async function init() {
  const m = location.hash.match(/^#a=([zj][\w-]+)/);
  if (m) {
    try {
      aluno = await decode(m[1]);
      store.set('mp_aluno', aluno);
      history.replaceState(null, '', location.pathname + location.search);
      mode = 'aluno';
    } catch { alert('Link de treino inválido ou incompleto.'); }
  } else {
    const saved = store.get('mp_aluno', null);
    if (saved && !store.get('mp_db', null)) { aluno = saved; mode = 'aluno'; }
  }
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
